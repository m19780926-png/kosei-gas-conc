<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校正ガス濃度 計算ツール</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1120">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  * { box-sizing: border-box; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; margin: 0 auto; max-width: 600px; padding: 20px 16px 32px; background: linear-gradient(180deg, #0a1120 0%, #0d1830 60%, #0a1428 100%); background-attachment: fixed; color: #e8eef7; min-height: 100vh; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: .06em; background: linear-gradient(90deg, #7dd3fc, #38bdf8 45%, #2dd4bf); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .sub { font-size: 13px; color: #93a5c4; margin-bottom: 18px; line-height: 1.7; }
  .card { background: linear-gradient(180deg, #16233c, #111c30); border: 1px solid #26375a; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .row-title { font-weight: bold; font-size: 15px; color: #bfe0ff; letter-spacing: .08em; }
  .del-btn { background: transparent; color: #f87171; border: 1px solid #7f2d3a; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .del-btn:active { background: rgba(248,113,113,.15); }
  label { display: block; font-size: 12px; color: #9fb0c9; margin: 12px 0 5px; letter-spacing: .05em; }
  select, input[type="number"], input[type="text"] { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #2b3c5c; border-radius: 10px; background: #0b1425; color: #eef4ff; }
  select:focus, input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,.25); }
  #rows .card { overflow: hidden; }
  #rows .row-title { font-size: 23px; color: #facc15; letter-spacing: .04em; text-shadow: 0 0 14px rgba(250,204,21,.4); }
  #rows .card::before { content: ""; display: block; height: 12px; margin: -16px -16px 14px; background: repeating-linear-gradient(45deg, #facc15 0 14px, #141414 14px 28px); }
  .result { margin-top: 16px; background: #0a1322; border: 1px solid rgba(248,113,113,.4); border-radius: 12px; padding: 14px; box-shadow: inset 0 0 24px rgba(248,113,113,.07); }
  .result .cap { font-size: 13px; color: #fca5a5; font-weight: bold; letter-spacing: .1em; margin-bottom: 10px; }
  .result .vals { display: flex; gap: 10px; flex-wrap: wrap; }
  .result .val { flex: 1; min-width: 130px; border-radius: 10px; padding: 12px 14px; }
  .val-low { background: linear-gradient(180deg, rgba(248,113,113,.16), rgba(248,113,113,.05)); border: 1.5px solid rgba(248,113,113,.65); }
  .val-high { background: linear-gradient(180deg, rgba(248,113,113,.16), rgba(248,113,113,.05)); border: 1.5px solid rgba(248,113,113,.65); }
  .result .val .k { font-size: 12px; color: #aebdd6; }
  .val .k { white-space: nowrap; }
  .result .val .v { font-size: 36px; font-weight: bold; font-family: "Roboto Mono", "SF Mono", Consolas, monospace; letter-spacing: .02em; line-height: 1.25; }
  .v-low { color: #f87171; text-shadow: 0 0 16px rgba(248,113,113,.55); }
  .v-high { color: #f87171; text-shadow: 0 0 16px rgba(248,113,113,.55); }
  .result .none { font-size: 14px; color: #888; }
  #addBtn { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; letter-spacing: .05em; background: linear-gradient(90deg, #2563eb, #0ea5e9); color: #fff; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 14px rgba(14,165,233,.35); }
  #exportBtn { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; letter-spacing: .05em; background: linear-gradient(90deg, #059669, #10b981); color: #fff; border: none; border-radius: 12px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 14px rgba(16,185,129,.3); }
  #addBtn:active, #exportBtn:active { transform: translateY(1px); }
  #exportPanel table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #exportPanel th, #exportPanel td { border: 1px solid #26375a; padding: 7px 4px; text-align: right; white-space: nowrap; }
  #exportPanel th { background: #122544; color: #bfe0ff; }
  #exportPanel td { font-family: "Roboto Mono", Consolas, monospace; }
  #exportPanel tr.gstart td { border-top: 3px solid #facc15; }
  #exportPanel tr.geven td { background: rgba(125,211,252,.07); }
  #exportPanel td:first-child { font-weight: bold; color: #facc15; }
  #exportPanel td.num-low { color: #f87171; font-weight: bold; font-size: 14px; }
  .chart-block { margin-top: 20px; border-top: 1px solid #263759; padding-top: 14px; }
  .chart-title { font-size: 15px; font-weight: bold; color: #facc15; margin-bottom: 2px; }
  .chart-note { font-size: 11px; color: #93a5c4; margin-bottom: 6px; }
  .conc-row { display: flex; align-items: center; gap: 10px; margin: 10px 0 2px; flex-wrap: nowrap; }
  .conc-row label { font-size: 14px; font-weight: bold; color: #e8eef7; margin: 0; white-space: nowrap; flex: none; }
  .conc-input { width: 110px !important; flex: none; }
  .conc-result { margin: 8px 0 4px; padding: 11px 12px; border-radius: 10px; font-size: 15px; font-weight: bold; border: 1.5px solid #facc15; background: rgba(250,204,21,.12); color: #e8eef7; }
  .conc-result .cf { color: #fde047; }
  .conc-result.none { border-color: #7f2d3a; background: rgba(248,113,113,.08); color: #fca5a5; }
  .plan-box { margin-top: 12px; border: 1.5px solid #34d399; background: rgba(52,211,153,.07); border-radius: 12px; padding: 12px 14px; }
  .plan-head { color: #34d399; font-weight: bold; font-size: 15px; margin-bottom: 4px; }
  .plan-line { font-size: 14px; line-height: 1.9; color: #e8eef7; }
  .plan-line .rec { color: #fde047; font-weight: bold; }
  .plan-note { font-size: 11px; color: #93a5c4; margin-top: 6px; }
  #exportPanel td.num-high { color: #f87171; font-weight: bold; font-size: 14px; }
  #exportPanel td:first-child { font-family: inherit; }
  #exportPanel th:first-child, #exportPanel td:first-child { text-align: left; }
  #csvBtn, #copyBtn, #graphBtn { padding: 10px 14px; font-size: 14px; border-radius: 10px; border: 1px solid #10b981; background: transparent; color: #34d399; cursor: pointer; margin-top: 12px; margin-right: 8px; }
  #csvBtn:active, #copyBtn:active, #graphBtn:active { background: rgba(16,185,129,.15); }
  #resetBtn { width: 100%; padding: 12px; font-size: 14px; background: transparent; color: #aebdd6; border: 1px solid #3b4c6b; border-radius: 12px; cursor: pointer; margin-top: 10px; }
  .note { font-size: 12px; color: #7e90ad; margin-top: 20px; line-height: 1.8; border-top: 1px solid #22345a; padding-top: 14px; }

  .factor-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .factor-row input { flex: 1; }
  .factor-del { background: transparent; color: #f87171; border: 1px solid #7f2d3a; border-radius: 8px; width: 42px; height: 46px; font-size: 16px; cursor: pointer; flex: none; }
  .add-factor-btn { background: transparent; color: #7dd3fc; border: 1px dashed #2b3c5c; border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
  .factor-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .factor-hint { font-size: 12px; color: #93a5c4; }
  .show-result { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #aebdd6; margin: 14px 0 0; cursor: pointer; }
  .show-result input { width: 19px; height: 19px; accent-color: #e24848; cursor: pointer; }
  .fgroup + .fgroup { margin-top: 12px; border-top: 1px dashed #26375a; padding-top: 10px; }
  .fcap { font-size: 12px; color: #fca5a5; font-weight: bold; letter-spacing: .06em; margin-bottom: 6px; }
  .result .none { color: #93a5c4; font-size: 14px; }
</style>
</head>
<body>

<h1>校正ガス濃度 計算ツール</h1>
<div class="sub">
  1stを入力すると、校正に使用できるガス濃度を表示します。<br>
  換算係数がある場合は、換算係数も入力してください。
</div>

<div id="rows"></div>

<button id="addBtn">＋ ガス名を追加</button>
<button id="exportBtn">校正ガス濃度一覧 / グラフ / CSV 出力</button>
<button id="resetBtn">すべてクリア</button>

<div id="exportPanel" class="card" style="display:none;">
  <div class="row-head"><span class="row-title">校正ガス濃度 一覧</span></div>
  <div id="exportBody"></div>
  <div id="graphArea"></div>
  <button id="csvBtn" type="button">CSVで保存</button>
  <button id="copyBtn" type="button">テキストをコピー</button>
  <button id="graphBtn" type="button">グラフを画像で保存</button>
</div>

<div class="note">
  計算式<br>
  ・換算係数が無い時：校正ガス濃度 ＝ 1st × 1.12〜1.6<br>
  ・換算係数が有る時：校正ガス濃度 ＝ 1st × 1.12〜1.6 ÷ 換算係数<br>
  ※結果は四捨五入せず、小数第3位以下を切り捨てて小数第2位まで表示します。<br>
  ※出力の一覧は、ガス名の順 → 換算係数の大きい順に並び替えて表示します。
</div>

<script>
var GASES = ["B2H6", "CLF3", "DIPAS", "F2", "HBR", "HF", "O3", "Si2H6"];

function trunc2(n) {
  return Math.floor(n * 100 + 1e-9) / 100;
}
function fmt(n) {
  if (!isFinite(n)) return "―";
  return trunc2(n).toFixed(2);
}

function makeFactorRow(card) {
  var row = document.createElement("div");
  row.className = "factor-row";
  row.innerHTML =
    '<input type="number" class="in-factor" inputmode="decimal" step="any" placeholder="例：0.95">' +
    '<button type="button" class="factor-del" tabindex="-1" style="display:none;">×</button>';
  var inp = row.querySelector(".in-factor");
  inp.addEventListener("input", function () { calc(card); });
  inp.addEventListener("keydown", function (e) {
    if (e.key === "Tab" && !e.shiftKey) {
      var inputs = card.querySelectorAll(".in-factor");
      var idx = Array.prototype.indexOf.call(inputs, inp);
      e.preventDefault();
      if (idx >= 0 && idx < inputs.length - 1) {
        inputs[idx + 1].focus();
      } else {
        var fr = makeFactorRow(card);
        card.querySelector(".factors").appendChild(fr);
        syncFactorDel(card);
        fr.querySelector(".in-factor").focus();
      }
    }
  });
  row.querySelector(".factor-del").addEventListener("click", function () {
    row.remove();
    syncFactorDel(card);
    calc(card);
  });
  return row;
}

function syncFactorDel(card) {
  var rows = card.querySelectorAll(".factor-row");
  for (var i = 0; i < rows.length; i++) {
    rows[i].querySelector(".factor-del").style.display = rows.length > 1 ? "block" : "none";
  }
}

function getFactors(card) {
  var inputs = card.querySelectorAll(".in-factor");
  var eff = [];
  for (var i = 0; i < inputs.length; i++) {
    var v = inputs[i].value.trim();
    if (v !== "") eff.push(v);
  }
  return eff;
}

function makeRow() {
  var card = document.createElement("div");
  card.className = "card";

  var options = '<option value="">（ガス名を選択）</option>';
  for (var i = 0; i < GASES.length; i++) {
    options += '<option value="' + GASES[i] + '">' + GASES[i] + "</option>";
  }
  options += '<option value="__other__">その他（自由入力）</option>';

  card.innerHTML =
    '<div class="row-head"><span class="row-title">ガス</span>' +
    '<button class="del-btn" type="button">削除</button></div>' +
    '<label>ガス名</label>' +
    '<select class="gas-sel">' + options + "</select>" +
    '<input type="text" class="gas-free" placeholder="ガス名を入力" style="display:none;margin-top:8px;">' +
    '<label>1st</label>' +
    '<input type="number" class="in-first" inputmode="decimal" step="any" placeholder="例：25">' +
    '<label>換算係数（無い場合は空欄）</label>' +
    '<div class="factors"></div>' +
    '<div class="factor-actions"><button type="button" class="add-factor-btn">＋ 換算係数を追加</button>' +
    '<span class="factor-hint">入力欄でTABキーを押しても入力欄が増えます</span></div>' +
    '<label class="show-result"><input type="checkbox" class="chk-result"> 計算結果を表示する</label>' +
    '<div class="result" style="display:none;"><div class="cap">校正に使用できるガス濃度</div>' +
    '<div class="groups">' +
    '<div class="fgroup"><div class="vals">' +
    '<div class="val val-low"><div class="k">1st×1.12〜</div><div class="v v-low">―</div></div>' +
    '<div class="val val-high"><div class="k">〜1st×1.6</div><div class="v v-high">―</div></div>' +
    "</div></div>" +
    "</div></div>";

  card.querySelector(".factors").appendChild(makeFactorRow(card));

  var sel = card.querySelector(".gas-sel");
  var free = card.querySelector(".gas-free");
  function updateTitle() {
    var name = "";
    if (sel.value === "__other__") {
      name = free.value.trim();
    } else {
      name = sel.value;
    }
    card.querySelector(".row-title").textContent = name || "ガス";
  }
  sel.addEventListener("change", function () {
    free.style.display = (sel.value === "__other__") ? "block" : "none";
    updateTitle();
  });
  free.addEventListener("input", updateTitle);

  card.querySelector(".del-btn").addEventListener("click", function () {
    card.remove();
  });

  card.querySelector(".add-factor-btn").addEventListener("click", function () {
    var fr = makeFactorRow(card);
    card.querySelector(".factors").appendChild(fr);
    syncFactorDel(card);
    fr.querySelector(".in-factor").focus();
  });

  card.querySelector(".in-first").addEventListener("input", function () { calc(card); });

  card.querySelector(".chk-result").addEventListener("change", function () {
    card.querySelector(".result").style.display = this.checked ? "" : "none";
  });
  return card;
}

function calc(card) {
  var first = parseFloat(card.querySelector(".in-first").value);
  var groupsEl = card.querySelector(".groups");

  if (isNaN(first)) {
    groupsEl.innerHTML =
      '<div class="fgroup"><div class="vals">' +
      '<div class="val val-low"><div class="k">1st×1.12〜</div><div class="v v-low">―</div></div>' +
      '<div class="val val-high"><div class="k">〜1st×1.6</div><div class="v v-high">―</div></div>' +
      "</div></div>";
    return;
  }

  var eff = getFactors(card);
  var list = eff.length ? eff : [null];
  var html = "";
  for (var i = 0; i < list.length; i++) {
    var f = list[i];
    var low = first * 1.12;
    var high = first * 1.6;
    var cap = "";
    var lowTxt, highTxt;
    if (f === null) {
      lowTxt = fmt(low);
      highTxt = fmt(high);
    } else {
      var fv = parseFloat(f);
      cap = '<div class="fcap">換算係数 ' + f + "</div>";
      if (isNaN(fv) || fv === 0) {
        lowTxt = "係数0は不可";
        highTxt = "係数0は不可";
      } else {
        lowTxt = fmt(low / fv);
        highTxt = fmt(high / fv);
      }
    }
    html += '<div class="fgroup">' + cap + '<div class="vals">' +
      '<div class="val val-low"><div class="k">1st×1.12〜</div><div class="v v-low">' + lowTxt + "</div></div>" +
      '<div class="val val-high"><div class="k">〜1st×1.6</div><div class="v v-high">' + highTxt + "</div></div>" +
      "</div></div>";
  }
  groupsEl.innerHTML = html;
}

document.getElementById("addBtn").addEventListener("click", function () {
  document.getElementById("rows").appendChild(makeRow());
});

function collectResults() {
  var cards = document.querySelectorAll("#rows .card");
  var list = [];
  for (var i = 0; i < cards.length; i++) {
    var card = cards[i];
    var first = parseFloat(card.querySelector(".in-first").value);
    if (isNaN(first)) continue;
    var sel = card.querySelector(".gas-sel");
    var name = "";
    if (sel.value === "__other__") {
      name = card.querySelector(".gas-free").value.trim();
    } else {
      name = sel.value;
    }
    if (!name) name = "（名称なし）";
    var eff = getFactors(card);
    var flist = eff.length ? eff : [null];
    for (var j = 0; j < flist.length; j++) {
      var f = flist[j];
      var low = first * 1.12;
      var high = first * 1.6;
      var sk = -1e18;
      var fDisp = "なし";
      if (f !== null) {
        var fv = parseFloat(f);
        if (isNaN(fv) || fv === 0) continue;
        low = low / fv;
        high = high / fv;
        sk = fv;
        fDisp = f;
      }
      list.push({
        name: name,
        first: first,
        factor: fDisp,
        sk: sk,
        low: trunc2(low).toFixed(2),
        high: trunc2(high).toFixed(2)
      });
    }
  }
  list.sort(function (a, b) {
    if (a.name < b.name) return -1;
    if (a.name > b.name) return 1;
    return b.sk - a.sk;
  });
  return list;
}

function fmtF(x) { return String(Math.round(x * 1000) / 1000); }

var chartGroups = [];

function buildCharts(list) {
  chartGroups = [];
  var groups = [];
  var gmap = {};
  var hasExcluded = false;
  for (var i = 0; i < list.length; i++) {
    var r = list[i];
    var key = r.name + "|" + r.first;
    if (!gmap[key]) { gmap[key] = { name: r.name, first: r.first, ranges: [] }; groups.push(gmap[key]); }
    if (r.factor === "なし") { hasExcluded = true; continue; }
    gmap[key].ranges.push({ f: parseFloat(r.factor), low: parseFloat(r.low), high: parseFloat(r.high) });
  }
  var out = "";
  for (var g = 0; g < groups.length; g++) {
    if (groups[g].ranges.length === 0) continue;
    out += chartBlock(groups[g], chartGroups.length);
    chartGroups.push(groups[g]);
  }
  if (out && hasExcluded) out += '<p class="chart-note">※換算係数なしの行はグラフに含んでいません。</p>';
  return out;
}


function planGroups(ranges) {
  var rest = ranges.slice();
  var groups = [];
  while (rest.length) {
    var anchor = rest[0];
    for (var i = 1; i < rest.length; i++) if (rest[i].low > anchor.low) anchor = rest[i];
    var p = anchor.low;
    var covered = [], next = [];
    for (var j = 0; j < rest.length; j++) {
      if (rest[j].low <= p && p <= rest[j].high) covered.push(rest[j]); else next.push(rest[j]);
    }
    var wmin = -Infinity, wmax = Infinity;
    for (var k = 0; k < covered.length; k++) {
      if (covered[k].low > wmin) wmin = covered[k].low;
      if (covered[k].high < wmax) wmax = covered[k].high;
    }
    var rec = trunc2(wmax - (wmax - wmin) * 0.1);
    var fs = [];
    for (var m = 0; m < covered.length; m++) if (fs.indexOf(covered[m].f) === -1) fs.push(covered[m].f);
    fs.sort(function (a, b) { return a - b; });
    groups.push({ wmin: wmin, wmax: wmax, rec: rec, factors: fs, count: covered.length });
    rest = next;
  }
  groups.sort(function (a, b) { return a.rec - b.rec; });
  return groups;
}

function renderChartSVG(grp, conc) {
  var ranges = grp.ranges;
  var maxHigh = 0;
  for (var i = 0; i < ranges.length; i++) if (ranges[i].high > maxHigh) maxHigh = ranges[i].high;

  var rawMax = maxHigh * 1.22;
  var pow = Math.pow(10, Math.floor(Math.log10(rawMax)));
  var cand = [1, 2, 4, 5, 8, 10];
  var xmax = 10 * pow;
  for (var c = 0; c < cand.length; c++) { if (cand[c] * pow >= rawMax) { xmax = cand[c] * pow; break; } }

  var W = 360, L = 48, R = 352, plotW = R - L;
  function X(v) { return L + (v / xmax) * plotW; }
  var top = (conc !== null && conc <= xmax) ? 22 : 8;
  var rowH = 36, barH = 18;
  var rowsH = ranges.length * rowH;
  var plans = planGroups(ranges);
  var hasBand = false;
  for (var pb = 0; pb < plans.length; pb++) if (plans[pb].count >= 2) hasBand = true;
  var axisY = top + rowsH + (hasBand ? 28 : 16);
  var H = axisY + 22;

  function isHit(rg) { return conc !== null && rg.low <= conc && conc <= rg.high; }

  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block;" font-family="ui-monospace,Menlo,Consolas,monospace">';
  for (var t = 0; t <= 4; t++) {
    var tv = xmax * t / 4, tx = X(tv);
    s += '<line x1="' + tx + '" y1="' + top + '" x2="' + tx + '" y2="' + (top + rowsH) + '" stroke="#263759" stroke-width="1"/>';
    s += '<text x="' + tx + '" y="' + axisY + '" font-size="10" fill="#c8d5eb" text-anchor="middle">' + fmtF(tv) + '</text>';
  }
  if (conc !== null && conc <= xmax) {
    var cx = X(conc);
    s += '<line x1="' + cx + '" y1="' + top + '" x2="' + cx + '" y2="' + (top + rowsH) + '" stroke="#facc15" stroke-width="2" stroke-dasharray="5 4"/>';
    var lx = Math.max(L + 14, Math.min(R - 14, cx));
    s += '<text x="' + lx + '" y="' + (top - 8) + '" font-size="10.5" font-weight="bold" fill="#fde047" text-anchor="middle">' + fmtF(conc) + '</text>';
  }
  for (var b2 = 0; b2 < plans.length; b2++) {
    var pg = plans[b2];
    if (pg.count < 2) continue;
    var bx1 = X(pg.wmin), bx2 = X(pg.wmax);
    s += '<rect x="' + bx1 + '" y="' + top + '" width="' + Math.max(bx2 - bx1, 1) + '" height="' + rowsH + '" fill="rgba(52,211,153,.13)" stroke="#34d399" stroke-opacity=".7" stroke-width="1"/>';
    var blab = pg.wmin.toFixed(2) + "〜" + pg.wmax.toFixed(2);
    if (bx2 - bx1 > blab.length * 6 + 8) {
      s += '<text x="' + ((bx1 + bx2) / 2) + '" y="' + (top + rowsH + 13) + '" font-size="9.5" fill="#34d399" text-anchor="middle">' + blab + '</text>';
    }
    var rcx = X(pg.rec);
    s += '<polygon points="' + (rcx - 4.5) + "," + top + " " + (rcx + 4.5) + "," + top + " " + rcx + "," + (top + 5.5) + '" fill="#facc15"/>';
  }
  for (var i2 = 0; i2 < ranges.length; i2++) {
    var rg = ranges[i2];
    var cy = top + rowH * (i2 + 0.5);
    var hit = isHit(rg);
    s += '<text x="' + (L - 6) + '" y="' + (cy + 4) + '" font-size="11" font-weight="bold" fill="' + (hit ? "#fde047" : "#c8d5eb") + '" text-anchor="end">' + fmtF(rg.f) + '</text>';
    var x1 = X(rg.low), x2 = X(rg.high);
    if (hit) {
      s += '<rect x="' + (x1 - 3.5) + '" y="' + (cy - barH / 2 - 3.5) + '" width="' + (x2 - x1 + 7) + '" height="' + (barH + 7) + '" rx="9" fill="none" stroke="#facc15" stroke-width="2.5"/>';
    }
    s += '<rect x="' + x1 + '" y="' + (cy - barH / 2) + '" width="' + Math.max(x2 - x1, 2) + '" height="' + barH + '" rx="7" fill="#5a2028" stroke="#f87171" stroke-width="1.5"/>';
    s += '<circle cx="' + x1 + '" cy="' + cy + '" r="3" fill="#f87171"/>';
    s += '<circle cx="' + x2 + '" cy="' + cy + '" r="3" fill="#f87171"/>';
    if (x1 - L < 40) {
      s += '<text x="' + x1 + '" y="' + (cy - 13) + '" font-size="10.5" fill="#fca5a5" text-anchor="start">' + rg.low.toFixed(2) + '</text>';
    } else {
      s += '<text x="' + (x1 - 5) + '" y="' + (cy + 4) + '" font-size="10.5" fill="#fca5a5" text-anchor="end">' + rg.low.toFixed(2) + '</text>';
    }
    s += '<text x="' + (x2 + 5) + '" y="' + (cy + 4) + '" font-size="10.5" fill="#fca5a5" text-anchor="start">' + rg.high.toFixed(2) + '</text>';
  }
  s += '<text transform="translate(13,' + (top + rowsH / 2) + ') rotate(-90)" font-size="11" fill="#c8d5eb" text-anchor="middle">換算係数</text>';
  s += '<text x="' + ((L + R) / 2) + '" y="' + (axisY + 18) + '" font-size="11" fill="#c8d5eb" text-anchor="middle">校正ガス濃度</text>';
  s += "</svg>";
  return s;
}

function chartBlock(grp, idx) {
  var plans = planGroups(grp.ranges);
  var marks = ["①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧", "⑨", "⑩"];
  var planHtml = '<div class="plan-box"><div class="plan-head">まとめ：校正ガス濃度は ' + plans.length + 'つ でOK</div>';
  for (var pi = 0; pi < plans.length; pi++) {
    var pg2 = plans[pi];
    var mark = pi < marks.length ? marks[pi] : "(" + (pi + 1) + ")";
    var rangeTxt = pg2.count >= 2
      ? "（共通範囲 " + pg2.wmin.toFixed(2) + "〜" + pg2.wmax.toFixed(2) + "）"
      : "（範囲 " + pg2.wmin.toFixed(2) + "〜" + pg2.wmax.toFixed(2) + "）";
    var flist = "";
    for (var fi = 0; fi < pg2.factors.length; fi++) flist += (fi ? "、" : "") + fmtF(pg2.factors[fi]);
    planHtml += '<div class="plan-line">' + mark + ' 推奨濃度 <span class="rec">' + pg2.rec.toFixed(2) + "</span>" + rangeTxt + " → 係数 " + flist + "</div>";
  }
  planHtml += '<div class="plan-note">※推奨濃度は共通範囲の上限近く（上限−幅の10%）で、1st×1.6に近い高い濃度です</div></div>';
  return '<div class="chart-block" data-gidx="' + idx + '">' +
    '<div class="chart-title">' + grp.name + " ・ 1st = " + grp.first + '</div>' +
    '<div class="chart-note">横棒：その係数で使える濃度範囲 ／ 緑の帯：まとめて校正できる共通範囲</div>' +
    '<div class="conc-row"><label>今のガス濃度は？</label><input type="number" class="conc-input" step="any" inputmode="decimal" placeholder="濃度"></div>' +
    '<div class="conc-result" style="display:none;"></div>' +
    '<div class="svg-wrap">' + renderChartSVG(grp, null) + "</div>" + planHtml + "</div>";
}

function bindConcInputs() {
  var inputs = document.querySelectorAll(".conc-input");
  for (var i = 0; i < inputs.length; i++) {
    inputs[i].addEventListener("input", function () {
      var block = this.closest(".chart-block");
      var grp = chartGroups[Number(block.getAttribute("data-gidx"))];
      var result = block.querySelector(".conc-result");
      var wrap = block.querySelector(".svg-wrap");
      var raw = this.value.trim();
      var v = parseFloat(raw);
      if (raw === "" || isNaN(v)) {
        result.style.display = "none";
        wrap.innerHTML = renderChartSVG(grp, null);
        return;
      }
      var fmin = null, fmax = null;
      for (var j = 0; j < grp.ranges.length; j++) {
        var rg = grp.ranges[j];
        if (rg.low <= v && v <= rg.high) {
          if (fmin === null || rg.f < fmin) fmin = rg.f;
          if (fmax === null || rg.f > fmax) fmax = rg.f;
        }
      }
      result.style.display = "block";
      if (fmin === null) {
        result.className = "conc-result none";
        result.textContent = "濃度 " + raw + " → 校正できる換算係数はありません";
      } else {
        result.className = "conc-result";
        var fr = fmin === fmax ? fmtF(fmin) : fmtF(fmin) + "〜" + fmtF(fmax);
        result.innerHTML = "濃度 " + raw + ' → 換算係数 <span class="cf">' + fr + "</span> が校正できます";
      }
      wrap.innerHTML = renderChartSVG(grp, v);
    });
  }
}

var lastExport = [];

document.getElementById("exportBtn").addEventListener("click", function () {
  lastExport = collectResults();
  var panel = document.getElementById("exportPanel");
  var body = document.getElementById("exportBody");
  if (lastExport.length === 0) {
    body.innerHTML = '<p style="font-size:14px;color:#93a5c4;">1stが入力されている行がありません。</p>';
    document.getElementById("graphArea").innerHTML = "";
    document.getElementById("csvBtn").style.display = "none";
    document.getElementById("copyBtn").style.display = "none";
    document.getElementById("graphBtn").style.display = "none";
  } else {
    var html = "<table><tr><th>ガス名</th><th>1st</th><th>換算係数</th><th>1st×1.12〜</th><th>〜1st×1.6</th></tr>";
    var prevName = null;
    var gIdx = -1;
    for (var i = 0; i < lastExport.length; i++) {
      var r = lastExport[i];
      var cls = "";
      if (r.name !== prevName) {
        gIdx++;
        if (i > 0) cls = "gstart";
        prevName = r.name;
      }
      if (gIdx % 2 === 1) cls = (cls + " geven").trim();
      html += "<tr" + (cls ? ' class="' + cls + '"' : "") + "><td>" + r.name + "</td><td>" + r.first + "</td><td>" + r.factor + "</td><td class=\"num-low\">" + r.low + "</td><td class=\"num-high\">" + r.high + "</td></tr>";
    }
    html += "</table>";
    body.innerHTML = html;
    document.getElementById("graphArea").innerHTML = buildCharts(lastExport);
    bindConcInputs();
    document.getElementById("csvBtn").style.display = "";
    document.getElementById("copyBtn").style.display = "";
    document.getElementById("graphBtn").style.display = "";
  }
  panel.style.display = "block";
  panel.scrollIntoView({ behavior: "smooth" });
});

document.getElementById("csvBtn").addEventListener("click", function () {
  if (lastExport.length === 0) return;
  var lines = ["ガス名,1st,換算係数,1st×1.12〜,〜1st×1.6"];
  for (var i = 0; i < lastExport.length; i++) {
    var r = lastExport[i];
    var nm = '"' + String(r.name).replace(/"/g, '""') + '"';
    lines.push(nm + "," + r.first + "," + r.factor + "," + r.low + "," + r.high);
  }
  var blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv" });
  var now = new Date();
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  var stamp = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + pad(now.getHours()) + pad(now.getMinutes());
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = stamp + "_kosei-gas-list.csv";
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById("copyBtn").addEventListener("click", function () {
  if (lastExport.length === 0) return;
  var lines = ["校正ガス濃度 一覧"];
  for (var i = 0; i < lastExport.length; i++) {
    var r = lastExport[i];
    lines.push(r.name + "　1st：" + r.first + "　換算係数：" + r.factor + "　1st×1.12〜：" + r.low + "　〜1st×1.6：" + r.high);
  }
  var text = lines.join("\n");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { alert("コピーしました"); });
  } else {
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    alert("コピーしました");
  }
});


document.getElementById("graphBtn").addEventListener("click", function () {
  var blocks = document.querySelectorAll("#graphArea .chart-block");
  if (!blocks.length) { alert("グラフがありません"); return; }
  var W = 760, pad = 28, gap = 30;
  var items = [];
  var totalH = pad;
  for (var i = 0; i < blocks.length; i++) {
    var b = blocks[i];
    var svg = b.querySelector("svg");
    var vb = svg.getAttribute("viewBox").split(/\s+/).map(Number);
    var svgH = (W - pad * 2) * vb[3] / vb[2];
    var res = b.querySelector(".conc-result");
    var resText = (res && res.style.display !== "none") ? res.textContent : "";
    var planHead = b.querySelector(".plan-head");
    var planLines = [];
    var plEls = b.querySelectorAll(".plan-line");
    for (var q = 0; q < plEls.length; q++) planLines.push(plEls[q].textContent);
    var planH = planHead ? (30 + planLines.length * 25 + 6) : 0;
    var h = 34 + (resText ? 30 : 0) + 8 + svgH + planH;
    items.push({ title: b.querySelector(".chart-title").textContent, svg: svg, svgH: svgH, resText: resText, planHead: planHead ? planHead.textContent : "", planLines: planLines, planH: planH, h: h });
    totalH += h + gap;
  }
  totalH += pad - gap;
  var canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = Math.ceil(totalH);
  var ctx = canvas.getContext("2d");
  ctx.fillStyle = "#0a1120";
  ctx.fillRect(0, 0, W, canvas.height);
  var y = pad;
  var pending = items.length;
  items.forEach(function (it) {
    var yy = y;
    if (ctx.roundRect) {
      ctx.fillStyle = "#111c30";
      ctx.beginPath();
      ctx.roundRect(8, yy - 14, W - 16, it.h + 24, 14);
      ctx.fill();
    }
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 21px sans-serif";
    ctx.textBaseline = "top";
    ctx.fillText(it.title, pad, yy);
    yy += 34;
    if (it.resText) {
      ctx.fillStyle = "#fde047";
      ctx.font = "bold 17px sans-serif";
      ctx.fillText(it.resText, pad, yy);
      yy += 30;
    }
    yy += 8;
    if (it.planHead) {
      var py = yy + it.svgH + 10;
      ctx.fillStyle = "#34d399";
      ctx.font = "bold 17px sans-serif";
      ctx.fillText(it.planHead, pad, py);
      py += 30;
      ctx.font = "15px sans-serif";
      for (var li = 0; li < it.planLines.length; li++) {
        ctx.fillStyle = "#e8eef7";
        var fs = 15;
        ctx.font = fs + "px sans-serif";
        while (ctx.measureText(it.planLines[li]).width > W - pad * 2 && fs > 10) { fs--; ctx.font = fs + "px sans-serif"; }
        ctx.fillText(it.planLines[li], pad, py);
        py += 25;
      }
    }
    var xml = new XMLSerializer().serializeToString(it.svg);
    if (xml.indexOf("xmlns=") === -1) xml = xml.replace("<svg", '<svg xmlns="http://www.w3.org/2000/svg"');
    var url = URL.createObjectURL(new Blob([xml], { type: "image/svg+xml;charset=utf-8" }));
    var img = new Image();
    img.onload = function () {
      ctx.drawImage(img, pad, yy, W - pad * 2, it.svgH);
      URL.revokeObjectURL(url);
      if (--pending === 0) {
        var now = new Date();
        function p(n) { return (n < 10 ? "0" : "") + n; }
        var stamp = now.getFullYear() + p(now.getMonth() + 1) + p(now.getDate()) + p(now.getHours()) + p(now.getMinutes());
        var a = document.createElement("a");
        a.href = canvas.toDataURL("image/png");
        a.download = stamp + "_kosei-gas-graph.png";
        a.click();
      }
    };
    img.src = url;
    y += it.h + gap;
  });
});

document.getElementById("resetBtn").addEventListener("click", function () {
  var rows = document.getElementById("rows");
  rows.innerHTML = "";
  rows.appendChild(makeRow());
  document.getElementById("exportPanel").style.display = "none";
});

    navigator.serviceWorker.register("sw.js").catch(function () {});
