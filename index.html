<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校正ガス濃度 計算ツール</title>

<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; margin: 0; padding: 16px; background: #f4f6f8; color: #222; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #555; margin-bottom: 16px; line-height: 1.6; }
  .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .row-title { font-weight: bold; font-size: 15px; }
  .del-btn { background: #e05353; color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  label { display: block; font-size: 13px; color: #444; margin: 10px 0 4px; }
  select, input[type="number"] { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #bbb; border-radius: 6px; background: #fff; }
  .result { margin-top: 14px; background: #eef4fb; border-radius: 8px; padding: 12px; }
  .result .cap { font-size: 13px; color: #33507a; margin-bottom: 6px; }
  .result .vals { display: flex; gap: 12px; flex-wrap: wrap; }
  .result .val { flex: 1; min-width: 130px; background: #fff; border: 1px solid #c8d8ee; border-radius: 6px; padding: 8px 10px; }
  .result .val .k { font-size: 12px; color: #666; }
  .result .val .v { font-size: 20px; font-weight: bold; }
  .result .none { font-size: 14px; color: #888; }
  #addBtn { width: 100%; padding: 14px; font-size: 16px; background: #2f6fd0; color: #fff; border: none; border-radius: 10px; cursor: pointer; }
  #exportBtn { width: 100%; padding: 14px; font-size: 16px; background: #2e9e62; color: #fff; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; }
  #exportPanel table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #exportPanel th, #exportPanel td { border: 1px solid #c8d8ee; padding: 7px 4px; text-align: right; white-space: nowrap; }
  .val .k { white-space: nowrap; }
  #exportPanel th { background: #eef4fb; }
  #exportPanel th:first-child, #exportPanel td:first-child { text-align: left; }
  #csvBtn, #copyBtn { padding: 10px 14px; font-size: 14px; border-radius: 8px; border: 1px solid #2e9e62; background: #fff; color: #2e7d4f; cursor: pointer; margin-top: 12px; margin-right: 8px; }
  #resetBtn { width: 100%; padding: 12px; font-size: 14px; background: #fff; color: #555; border: 1px solid #bbb; border-radius: 10px; cursor: pointer; margin-top: 10px; }
  .note { font-size: 12px; color: #777; margin-top: 16px; line-height: 1.7; }
</style>
</head>
<body>

<h1>校正ガス濃度 計算ツール</h1>
<div class="sub">
  1stを入力すると、校正に使用できるガス濃度を表示します。<br>
  換算係数がある場合は、換算係数も入力してください。
</div>

<div id="rows"></div>

<button id="addBtn">＋ 行を追加</button>
<button id="exportBtn">出力する</button>
<button id="resetBtn">すべてクリア</button>

<div id="exportPanel" class="card" style="display:none;">
  <div class="row-head"><span class="row-title">校正ガス濃度 一覧</span></div>
  <div id="exportBody"></div>
  <button id="csvBtn" type="button">CSVで保存</button>
  <button id="copyBtn" type="button">テキストをコピー</button>
</div>

<div class="note">
  計算式<br>
  ・換算係数が無い時：校正ガス濃度 ＝ 1st × 1.12〜1.6<br>
  ・換算係数が有る時：校正ガス濃度 ＝ 1st × 1.12〜1.6 ÷ 換算係数<br>
  ※結果は四捨五入せず、小数第3位以下を切り捨てて小数第2位まで表示します。
</div>

<script>
var GASES = ["B2H6", "CLF3", "DIPAS", "F2", "HBR", "HF", "O3", "Si2H6"];

function trunc2(n) {
  return Math.floor(n * 100 + 1e-9) / 100;
}
function fmt(n) {
  if (!isFinite(n)) return "―";
  return trunc2(n).toFixed(2);
}

function makeRow() {
  var card = document.createElement("div");
  card.className = "card";

  var options = '<option value="">（ガス名を選択）</option>';
  for (var i = 0; i < GASES.length; i++) {
    options += '<option value="' + GASES[i] + '">' + GASES[i] + "</option>";
  }
  options += '<option value="__other__">その他（自由入力）</option>';

  card.innerHTML =
    '<div class="row-head"><span class="row-title">ガス</span>' +
    '<button class="del-btn" type="button">削除</button></div>' +
    '<label>ガス名</label>' +
    '<select class="gas-sel">' + options + "</select>" +
    '<input type="text" class="gas-free" placeholder="ガス名を入力" style="display:none;margin-top:8px;width:100%;padding:10px;font-size:16px;border:1px solid #bbb;border-radius:6px;">' +
    '<label>1st</label>' +
    '<input type="number" class="in-first" inputmode="decimal" step="any" placeholder="例：25">' +
    '<label>換算係数（無い場合は空欄）</label>' +
    '<input type="number" class="in-factor" inputmode="decimal" step="any" placeholder="例：0.95">' +
    '<div class="result"><div class="cap">校正に使用できるガス濃度</div>' +
    '<div class="vals">' +
    '<div class="val"><div class="k">1st×1.12〜</div><div class="v v-low">―</div></div>' +
    '<div class="val"><div class="k">〜1st×1.6</div><div class="v v-high">―</div></div>' +
    "</div></div>";

  var sel = card.querySelector(".gas-sel");
  var free = card.querySelector(".gas-free");
  sel.addEventListener("change", function () {
    free.style.display = (sel.value === "__other__") ? "block" : "none";
  });

  card.querySelector(".del-btn").addEventListener("click", function () {
    card.remove();
  });

  var inputs = card.querySelectorAll(".in-first, .in-factor");
  for (var j = 0; j < inputs.length; j++) {
    inputs[j].addEventListener("input", function () { calc(card); });
  }
  return card;
}

function calc(card) {
  var first = parseFloat(card.querySelector(".in-first").value);
  var factorRaw = card.querySelector(".in-factor").value;
  var lowEl = card.querySelector(".v-low");
  var highEl = card.querySelector(".v-high");

  if (isNaN(first)) {
    lowEl.textContent = "―";
    highEl.textContent = "―";
    return;
  }
  var low = first * 1.12;
  var high = first * 1.6;
  var factor = parseFloat(factorRaw);
  if (factorRaw !== "" && !isNaN(factor)) {
    if (factor === 0) {
      lowEl.textContent = "係数0は不可";
      highEl.textContent = "係数0は不可";
      return;
    }
    low = low / factor;
    high = high / factor;
  }
  lowEl.textContent = fmt(low);
  highEl.textContent = fmt(high);
}

document.getElementById("addBtn").addEventListener("click", function () {
  document.getElementById("rows").appendChild(makeRow());
});

function collectResults() {
  var cards = document.querySelectorAll("#rows .card");
  var list = [];
  for (var i = 0; i < cards.length; i++) {
    var card = cards[i];
    var first = parseFloat(card.querySelector(".in-first").value);
    if (isNaN(first)) continue;
    var sel = card.querySelector(".gas-sel");
    var name = "";
    if (sel.value === "__other__") {
      name = card.querySelector(".gas-free").value.trim();
    } else {
      name = sel.value;
    }
    if (!name) name = "（名称なし）";
    var factorRaw = card.querySelector(".in-factor").value;
    var factor = parseFloat(factorRaw);
    var hasFactor = factorRaw !== "" && !isNaN(factor) && factor !== 0;
    var low = first * 1.12;
    var high = first * 1.6;
    if (hasFactor) { low = low / factor; high = high / factor; }
    list.push({
      name: name,
      first: first,
      factor: hasFactor ? factorRaw : "なし",
      low: trunc2(low).toFixed(2),
      high: trunc2(high).toFixed(2)
    });
  }
  return list;
}

var lastExport = [];

document.getElementById("exportBtn").addEventListener("click", function () {
  lastExport = collectResults();
  var panel = document.getElementById("exportPanel");
  var body = document.getElementById("exportBody");
  if (lastExport.length === 0) {
    body.innerHTML = '<p style="font-size:14px;color:#888;">1stが入力されている行がありません。</p>';
    document.getElementById("csvBtn").style.display = "none";
    document.getElementById("copyBtn").style.display = "none";
  } else {
    var html = "<table><tr><th>ガス名</th><th>1st</th><th>換算係数</th><th>1st×1.12〜</th><th>〜1st×1.6</th></tr>";
    for (var i = 0; i < lastExport.length; i++) {
      var r = lastExport[i];
      html += "<tr><td>" + r.name + "</td><td>" + r.first + "</td><td>" + r.factor + "</td><td>" + r.low + "</td><td>" + r.high + "</td></tr>";
    }
    html += "</table>";
    body.innerHTML = html;
    document.getElementById("csvBtn").style.display = "";
    document.getElementById("copyBtn").style.display = "";
  }
  panel.style.display = "block";
  panel.scrollIntoView({ behavior: "smooth" });
});

document.getElementById("csvBtn").addEventListener("click", function () {
  if (lastExport.length === 0) return;
  var lines = ["ガス名,1st,換算係数,1st×1.12〜,〜1st×1.6"];
  for (var i = 0; i < lastExport.length; i++) {
    var r = lastExport[i];
    var nm = '"' + String(r.name).replace(/"/g, '""') + '"';
    lines.push(nm + "," + r.first + "," + r.factor + "," + r.low + "," + r.high);
  }
  var blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "kosei-gas-list.csv";
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById("copyBtn").addEventListener("click", function () {
  if (lastExport.length === 0) return;
  var lines = ["校正ガス濃度 一覧"];
  for (var i = 0; i < lastExport.length; i++) {
    var r = lastExport[i];
    lines.push(r.name + "　1st：" + r.first + "　換算係数：" + r.factor + "　1st×1.12〜：" + r.low + "　〜1st×1.6：" + r.high);
  }
  var text = lines.join("\n");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { alert("コピーしました"); });
  } else {
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    alert("コピーしました");
  }
});

document.getElementById("resetBtn").addEventListener("click", function () {
  var rows = document.getElementById("rows");
  rows.innerHTML = "";
  rows.appendChild(makeRow());
  document.getElementById("exportPanel").style.display = "none";
});

// 初期表示は2行
document.getElementById("rows").appendChild(makeRow());
document.getElementById("rows").appendChild(makeRow());
</script>

</body>
</html>
