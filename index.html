<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校正ガス濃度 計算ツール</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1120">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  * { box-sizing: border-box; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; margin: 0 auto; max-width: 600px; padding: 20px 16px 32px; background: linear-gradient(180deg, #0a1120 0%, #0d1830 60%, #0a1428 100%); background-attachment: fixed; color: #e8eef7; min-height: 100vh; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  h1 { font-size: clamp(22px, 7.4vw, 34px); white-space: nowrap; line-height: 1.3; margin: 0 0 8px; letter-spacing: 0; background: linear-gradient(90deg, #7dd3fc, #38bdf8 45%, #2dd4bf); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .sub { font-size: 15px; color: #aebdd6; margin-bottom: 12px; line-height: 1.7; }
  .warning-note { background: rgba(127, 29, 29, .25); border: 1px solid #7f2d3a; border-radius: 10px; padding: 10px 12px; color: #f87171; font-size: 13px; font-weight: bold; line-height: 1.7; margin-bottom: 18px; }
  .card { background: linear-gradient(180deg, #16233c, #111c30); border: 1px solid #26375a; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .row-title { font-weight: bold; font-size: 15px; color: #bfe0ff; letter-spacing: .08em; }
  .del-btn { background: transparent; color: #f87171; border: 1px solid #7f2d3a; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .del-btn:active { background: rgba(248,113,113,.15); }
  label { display: block; font-size: 12px; color: #9fb0c9; margin: 12px 0 5px; letter-spacing: .05em; }
  select, input[type="number"], input[type="text"] { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #2b3c5c; border-radius: 10px; background: #0b1425; color: #eef4ff; }
  select:focus, input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,.25); }
  #rows .card { overflow: hidden; }
  #rows .row-title { font-size: 23px; color: #facc15; letter-spacing: .04em; text-shadow: 0 0 14px rgba(250,204,21,.4); }
  #rows .row-head { justify-content: flex-start; cursor: pointer; }
  #rows .del-btn { margin-left: auto; }
  .toggle-mark { color: #93a5c4; font-size: 14px; margin-right: 8px; }
  .row-summary { display: none; margin-left: 12px; font-size: 13.5px; color: #c8d5eb; }
  .card.closed .row-summary { display: inline; }
  .card.closed .card-body { display: none; }
  #rows .card { scroll-margin-top: 84px; }
  #chipBar { position: sticky; top: 0; z-index: 60; display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 2px; background: rgba(10,17,32,.94); }
  #chipBar:empty { display: none; }
  .chip { padding: 8px 16px; border-radius: 999px; border: 1px solid #6ee7b7; background: linear-gradient(180deg, #10b981, #0d946e); color: #042018; font-size: 14px; font-weight: bold; cursor: pointer; font-family: inherit; box-shadow: 0 3px 8px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.35); }
  .chip:active { background: linear-gradient(180deg, #0d946e, #0b7a5c); transform: translateY(2px); box-shadow: 0 1px 3px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.2); }
  #rows .card::before { content: ""; display: block; height: 12px; margin: -16px -16px 14px; background: repeating-linear-gradient(45deg, #facc15 0 14px, #141414 14px 28px); }
  .result { margin-top: 16px; background: #0a1322; border: 1px solid rgba(248,113,113,.4); border-radius: 12px; padding: 14px; box-shadow: inset 0 0 24px rgba(248,113,113,.07); }
  .result .cap { font-size: 13px; color: #fca5a5; font-weight: bold; letter-spacing: .1em; margin-bottom: 10px; }
  .result .vals { display: flex; gap: 10px; flex-wrap: wrap; }
  .result .val { flex: 1; min-width: 130px; border-radius: 10px; padding: 12px 14px; }
  .val-low { background: linear-gradient(180deg, rgba(248,113,113,.16), rgba(248,113,113,.05)); border: 1.5px solid rgba(248,113,113,.65); }
  .val-high { background: linear-gradient(180deg, rgba(248,113,113,.16), rgba(248,113,113,.05)); border: 1.5px solid rgba(248,113,113,.65); }
  .result .val .k { font-size: 12px; color: #aebdd6; }
  .val .k { white-space: nowrap; }
  .result .val .v { font-size: 36px; font-weight: bold; font-family: "Roboto Mono", "SF Mono", Consolas, monospace; letter-spacing: .02em; line-height: 1.25; }
  .v-low { color: #f87171; text-shadow: 0 0 16px rgba(248,113,113,.55); }
  .v-high { color: #f87171; text-shadow: 0 0 16px rgba(248,113,113,.55); }
  .result .none { font-size: 14px; color: #888; }
  #addBtn { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; letter-spacing: .05em; background: linear-gradient(180deg, #243a5c, #0d1a2e); color: #b8d6f5; border: 1px solid #40648f; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.35); }
  #exportBtn { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; letter-spacing: .05em; background: linear-gradient(180deg, #17452f, #082418); color: #b2e6c8; border: 1px solid #2f7d54; border-radius: 12px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.35); }
  #addBtn:active, #exportBtn:active { transform: translateY(1px); }
  #exportPanel table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #exportPanel th, #exportPanel td { border: 1px solid #26375a; padding: 7px 4px; text-align: right; white-space: nowrap; }
  #exportPanel th { background: #122544; color: #bfe0ff; }
  #exportPanel td { font-family: "Roboto Mono", Consolas, monospace; }
  #exportPanel tr.gstart td { border-top: 3px solid #facc15; }
  #exportPanel tr.geven td { background: rgba(125,211,252,.07); }
  #exportPanel td:first-child { font-weight: bold; color: #facc15; }
  #exportPanel td.num-low { color: #f87171; font-weight: bold; font-size: 14px; }
  .chart-block { margin-top: 20px; border-top: 1px solid #263759; padding-top: 14px; }
  .chart-title { font-size: 15px; font-weight: bold; color: #facc15; margin-bottom: 2px; }
  .chart-note { font-size: 11px; color: #93a5c4; margin-bottom: 6px; }
  .conc-row { display: flex; align-items: center; gap: 10px; margin: 10px 0 2px; flex-wrap: nowrap; }
  .conc-row label { font-size: 14px; font-weight: bold; color: #e8eef7; margin: 0; white-space: nowrap; flex: none; }
  .conc-input { width: 110px !important; flex: none; }
  .conc-result { margin: 8px 0 4px; padding: 11px 12px; border-radius: 10px; font-size: 15px; font-weight: bold; border: 1.5px solid #facc15; background: rgba(250,204,21,.12); color: #e8eef7; }
  .conc-result .cf { color: #fde047; }
  .conc-result.none { border-color: #7f2d3a; background: rgba(248,113,113,.08); color: #fca5a5; }
  .pattern-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 2px; }
  .pattern-btn { padding: 9px 4px; border-radius: 10px; border: 1px solid #475569; background: #1e293b; color: #cbd5e1; font-size: 13px; font-weight: bold; cursor: pointer; white-space: nowrap; }
  .pattern-btn.active { background: linear-gradient(180deg, #10b981, #0d946e); border: 1px solid #10b981; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35); }
  .pattern-btn:active { transform: translateY(1px); }
  .plan-box { margin-top: 12px; border: 1.5px solid #2b4a6b; background: rgba(125,211,252,.05); border-radius: 12px; padding: 12px 14px; }
  .plan-head { color: #e8eef7; font-weight: bold; font-size: 15px; margin-bottom: 4px; }
  .plan-line { font-size: 14px; line-height: 1.9; color: #e8eef7; }
  .plan-line .rec { color: #fde047; font-weight: bold; }
  #exportPanel td.num-high { color: #f87171; font-weight: bold; font-size: 14px; }
  #exportPanel td.grp-cell, #exportPanel th.grp-head { text-align: center; }
  #exportPanel td.grp-cell { font-weight: bold; font-size: 15px; }
  #exportPanel td.gas-name { font-weight: bold; color: #facc15; font-family: inherit; }
  #exportPanel .table-wrap { overflow-x: auto; }
  @media (max-width: 480px) {
    #exportPanel table { font-size: 11px; }
    #exportPanel th, #exportPanel td { padding: 6px 2px; }
    #exportPanel th { white-space: nowrap; font-size: 10.5px; }
    #exportPanel td.grp-cell { font-size: 13px; }
    #exportPanel td.num-low, #exportPanel td.num-high { font-size: 12px; }
    .pattern-btn { font-size: 12px; padding: 8px 2px; }
    .plan-line { font-size: 13px; }
    .chart-block svg { width: calc(100% + 28px) !important; margin-left: -14px; }
  }
  #exportPanel td:first-child { font-family: inherit; }
  #exportPanel th:first-child, #exportPanel td:first-child { text-align: left; }
  .gas-csv, .gas-copy, .gas-graph, .gas-table-img { padding: 10px 14px; font-size: 14px; font-weight: bold; border-radius: 10px; border: 1px solid #6ee7b7; background: linear-gradient(180deg, #10b981, #0d946e); color: #042018; cursor: pointer; margin-top: 12px; margin-right: 8px; box-shadow: 0 3px 8px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.35); }
  .gas-csv:active, .gas-copy:active, .gas-graph:active, .gas-table-img:active { background: linear-gradient(180deg, #0d946e, #0b7a5c); transform: translateY(2px); box-shadow: 0 1px 3px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.2); }
  .gas-block { border: 1.5px solid #22385c; border-radius: 14px; padding: 14px; margin-bottom: 18px; background: rgba(255,255,255,.02); }
  .gas-block:last-child { margin-bottom: 0; }
  .gas-head { font-size: 17px; font-weight: bold; color: #dbe7f7; margin-bottom: 10px; }
  .gas-head span { color: #facc15; }
  #resetBtn { width: 100%; padding: 12px; font-size: 14px; background: transparent; color: #aebdd6; border: 1px solid #3b4c6b; border-radius: 12px; cursor: pointer; margin-top: 10px; }
  .note { font-size: 12px; color: #7e90ad; margin-top: 20px; line-height: 1.8; border-top: 1px solid #22345a; padding-top: 14px; }

  .factor-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .factor-row input { flex: 1; }
  .factor-del { background: transparent; color: #f87171; border: 1px solid #7f2d3a; border-radius: 8px; width: 42px; height: 46px; font-size: 16px; cursor: pointer; flex: none; }
  .add-factor-btn { background: transparent; color: #7dd3fc; border: 1px dashed #2b3c5c; border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
  .factor-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .factor-hint { font-size: 12px; color: #93a5c4; }
  .show-result { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #aebdd6; margin: 14px 0 0; cursor: pointer; }
  .show-result input { width: 19px; height: 19px; accent-color: #e24848; cursor: pointer; }
  .fgroup + .fgroup { margin-top: 12px; border-top: 1px dashed #26375a; padding-top: 10px; }
  .fcap { font-size: 12px; color: #fca5a5; font-weight: bold; letter-spacing: .06em; margin-bottom: 6px; }
  .result .none { color: #93a5c4; font-size: 14px; }
</style>
</head>
<body>

<h1>校正ガス濃度 計算ツール</h1>
<div class="sub">
  ガス名、1st、換算係数を入力してください。<br>
  （換算係数が無い時は未入力）
</div>
<div class="warning-note">
  【注意】<br>
  本ツールで算出される値は、校正ガス濃度を決定する際の参考値です。
</div>

<div id="chipBar"></div>
<div id="rows"></div>

<button id="addBtn">＋ ガス名を追加</button>
<button id="exportBtn">校正ガス濃度一覧 / グラフ / CSV 出力</button>
<button id="resetBtn">すべてクリア</button>

<div id="exportPanel" class="card" style="display:none;">
  <div id="exportBody"></div>
</div>

<div class="note">
  計算式<br>
  ・換算係数が無い時：校正ガス濃度 ＝ 1st × 1.12〜1.6<br>
  ・換算係数が有る時：校正ガス濃度 ＝ 1st × 1.12〜1.6 ÷ 換算係数<br>
  ※結果は四捨五入せず、小数第3位以下を切り捨てて小数第2位まで表示します。<br>
  ※出力の一覧は、ガス名の順 → 換算係数の大きい順に並び替えて表示します。
</div>

<script>
var GASES = ["B2H6", "CLF3", "DIPAS", "F2", "HBR", "HF", "O3", "Si2H6"];

function trunc2(n) {
  return Math.floor(n * 100 + 1e-9) / 100;
}
function fmt(n) {
  if (!isFinite(n)) return "―";
  return trunc2(n).toFixed(2);
}

function makeFactorRow(card) {
  var row = document.createElement("div");
  row.className = "factor-row";
  row.innerHTML =
    '<input type="number" class="in-factor" inputmode="decimal" step="any" placeholder="例：0.95">' +
    '<button type="button" class="factor-del" tabindex="-1" style="display:none;">×</button>';
  var inp = row.querySelector(".in-factor");
  inp.addEventListener("input", function () {
    if (inp.value.indexOf("-") !== -1) inp.value = inp.value.replace(/-/g, "");
    calc(card);
  });
  inp.addEventListener("keydown", function (e) {
    if (e.key === "Tab" && !e.shiftKey) {
      var inputs = card.querySelectorAll(".in-factor");
      var idx = Array.prototype.indexOf.call(inputs, inp);
      e.preventDefault();
      if (idx >= 0 && idx < inputs.length - 1) {
        inputs[idx + 1].focus();
      } else {
        var fr = makeFactorRow(card);
        card.querySelector(".factors").appendChild(fr);
        syncFactorDel(card);
        fr.querySelector(".in-factor").focus();
      }
    }
  });
  row.querySelector(".factor-del").addEventListener("click", function () {
    row.remove();
    syncFactorDel(card);
    calc(card);
  });
  return row;
}

function syncFactorDel(card) {
  var rows = card.querySelectorAll(".factor-row");
  for (var i = 0; i < rows.length; i++) {
    rows[i].querySelector(".factor-del").style.display = rows.length > 1 ? "block" : "none";
  }
}

function getFactors(card) {
  var inputs = card.querySelectorAll(".in-factor");
  var eff = [];
  for (var i = 0; i < inputs.length; i++) {
    var v = inputs[i].value.trim();
    if (v !== "") eff.push(v);
  }
  return eff;
}

function makeRow() {
  var card = document.createElement("div");
  card.className = "card";

  var options = '<option value="">（ガス名を選択）</option>';
  for (var i = 0; i < GASES.length; i++) {
    options += '<option value="' + GASES[i] + '">' + GASES[i] + "</option>";
  }
  options += '<option value="__other__">その他（自由入力）</option>';

  card.innerHTML =
    '<div class="row-head"><span class="toggle-mark">▼</span><span class="row-title">ガス</span>' +
    '<span class="row-summary"></span>' +
    '<button class="del-btn" type="button">削除</button></div>' +
    '<div class="card-body">' +
    '<label>ガス名</label>' +
    '<select class="gas-sel">' + options + "</select>" +
    '<input type="text" class="gas-free" placeholder="ガス名を入力" style="display:none;margin-top:8px;">' +
    '<label>1st</label>' +
    '<input type="number" class="in-first" inputmode="decimal" step="any" placeholder="例：25">' +
    '<label>換算係数（無い場合は空欄）</label>' +
    '<div class="factors"></div>' +
    '<div class="factor-actions"><button type="button" class="add-factor-btn">＋ 換算係数を追加</button>' +
    '<span class="factor-hint">入力欄でTABキーを押しても入力欄が増えます</span></div>' +
    '<label class="show-result"><input type="checkbox" class="chk-result"> 計算結果を表示する</label>' +
    '<div class="result" style="display:none;"><div class="cap">校正に使用できるガス濃度</div>' +
    '<div class="groups">' +
    '<div class="fgroup"><div class="vals">' +
    '<div class="val val-low"><div class="k">1st×1.12〜</div><div class="v v-low">―</div></div>' +
    '<div class="val val-high"><div class="k">〜1st×1.6</div><div class="v v-high">―</div></div>' +
    "</div></div>" +
    "</div></div></div>";

  card.querySelector(".factors").appendChild(makeFactorRow(card));

  var sel = card.querySelector(".gas-sel");
  var free = card.querySelector(".gas-free");
  function updateTitle() {
    var name = "";
    if (sel.value === "__other__") {
      name = free.value.trim();
    } else {
      name = sel.value;
    }
    card.querySelector(".row-title").textContent = name || "ガス";
    refreshChips();
  }
  sel.addEventListener("change", function () {
    free.style.display = (sel.value === "__other__") ? "block" : "none";
    updateTitle();
  });
  free.addEventListener("input", updateTitle);

  card.querySelector(".del-btn").addEventListener("click", function (e) {
    e.stopPropagation();
    card.remove();
    refreshChips();
  });

  card.querySelector(".row-head").addEventListener("click", function () {
    var closed = card.classList.toggle("closed");
    card.querySelector(".toggle-mark").textContent = closed ? "▶" : "▼";
  });

  card.querySelector(".add-factor-btn").addEventListener("click", function () {
    var fr = makeFactorRow(card);
    card.querySelector(".factors").appendChild(fr);
    syncFactorDel(card);
    fr.querySelector(".in-factor").focus();
  });

  card.querySelector(".in-first").addEventListener("input", function () {
    if (this.value.indexOf("-") !== -1) this.value = this.value.replace(/-/g, "");
    calc(card);
  });

  card.querySelector(".chk-result").addEventListener("change", function () {
    card.querySelector(".result").style.display = this.checked ? "" : "none";
  });
  updateSummary(card);
  return card;
}

function updateSummary(card) {
  var sumEl = card.querySelector(".row-summary");
  if (!sumEl) return;
  var first = parseFloat(card.querySelector(".in-first").value);
  if (isNaN(first)) { sumEl.textContent = "未入力"; return; }
  var eff = getFactors(card);
  var txt = "1st = " + fmtF(first) + " ・ 係数 " + (eff.length ? eff.length + "個" : "なし");
  var vs = card.querySelectorAll(".groups .v");
  var mn = Infinity, mx = -Infinity;
  for (var i = 0; i < vs.length; i++) {
    var n = parseFloat(vs[i].textContent);
    if (isFinite(n)) { if (n < mn) mn = n; if (n > mx) mx = n; }
  }
  if (mn !== Infinity) txt += " ・ 結果 " + mn.toFixed(2) + "〜" + mx.toFixed(2);
  sumEl.textContent = txt;
}

function setCardOpen(card, open) {
  card.classList.toggle("closed", !open);
  card.querySelector(".toggle-mark").textContent = open ? "▼" : "▶";
}

function refreshChips() {
  var bar = document.getElementById("chipBar");
  if (!bar) return;
  bar.innerHTML = "";
  var cards = document.querySelectorAll("#rows .card");
  for (var i = 0; i < cards.length; i++) {
    (function (card) {
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.textContent = card.querySelector(".row-title").textContent;
      chip.addEventListener("click", function () {
        setCardOpen(card, true);
        card.scrollIntoView({ behavior: "smooth", block: "start" });
      });
      bar.appendChild(chip);
    })(cards[i]);
  }
}

function calc(card) {
  var first = parseFloat(card.querySelector(".in-first").value);
  var groupsEl = card.querySelector(".groups");

  if (isNaN(first)) {
    groupsEl.innerHTML =
      '<div class="fgroup"><div class="vals">' +
      '<div class="val val-low"><div class="k">1st×1.12〜</div><div class="v v-low">―</div></div>' +
      '<div class="val val-high"><div class="k">〜1st×1.6</div><div class="v v-high">―</div></div>' +
      "</div></div>";
    updateSummary(card);
    return;
  }

  var eff = getFactors(card);
  var list = eff.length ? eff : [null];
  var html = "";
  for (var i = 0; i < list.length; i++) {
    var f = list[i];
    var low = first * 1.12;
    var high = first * 1.6;
    var cap = "";
    var lowTxt, highTxt;
    if (f === null) {
      lowTxt = fmt(low);
      highTxt = fmt(high);
    } else {
      var fv = parseFloat(f);
      cap = '<div class="fcap">換算係数 ' + f + "</div>";
      if (isNaN(fv) || fv === 0) {
        lowTxt = "係数0は不可";
        highTxt = "係数0は不可";
      } else {
        lowTxt = fmt(low / fv);
        highTxt = fmt(high / fv);
      }
    }
    html += '<div class="fgroup">' + cap + '<div class="vals">' +
      '<div class="val val-low"><div class="k">1st×1.12〜</div><div class="v v-low">' + lowTxt + "</div></div>" +
      '<div class="val val-high"><div class="k">〜1st×1.6</div><div class="v v-high">' + highTxt + "</div></div>" +
      "</div></div>";
  }
  groupsEl.innerHTML = html;
  updateSummary(card);
}

document.getElementById("addBtn").addEventListener("click", function () {
  var cards = document.querySelectorAll("#rows .card");
  for (var i = 0; i < cards.length; i++) setCardOpen(cards[i], false);
  document.getElementById("rows").appendChild(makeRow());
  refreshChips();
});

function collectResults() {
  var cards = document.querySelectorAll("#rows .card");
  var list = [];
  for (var i = 0; i < cards.length; i++) {
    var card = cards[i];
    var first = parseFloat(card.querySelector(".in-first").value);
    if (isNaN(first)) continue;
    var sel = card.querySelector(".gas-sel");
    var name = "";
    if (sel.value === "__other__") {
      name = card.querySelector(".gas-free").value.trim();
    } else {
      name = sel.value;
    }
    if (!name) name = "（名称なし）";
    var eff = getFactors(card);
    var flist = eff.length ? eff : [null];
    for (var j = 0; j < flist.length; j++) {
      var f = flist[j];
      var low = first * 1.12;
      var high = first * 1.6;
      var sk = -1e18;
      var fDisp = "なし";
      if (f !== null) {
        var fv = parseFloat(f);
        if (isNaN(fv) || fv === 0) continue;
        low = low / fv;
        high = high / fv;
        sk = fv;
        fDisp = f;
      }
      list.push({
        name: name,
        first: first,
        factor: fDisp,
        sk: sk,
        low: trunc2(low).toFixed(2),
        high: trunc2(high).toFixed(2)
      });
    }
  }
  list.sort(function (a, b) {
    if (a.name < b.name) return -1;
    if (a.name > b.name) return 1;
    return b.sk - a.sk;
  });
  return list;
}

function fmtF(x) { return String(Math.round(x * 1000) / 1000); }

var chartGroups = [];

function buildCharts(list) {
  var groups = [];
  var gmap = {};
  var hasExcluded = false;
  for (var i = 0; i < list.length; i++) {
    var r = list[i];
    var key = r.name + "|" + r.first;
    if (!gmap[key]) { gmap[key] = { name: r.name, first: r.first, ranges: [] }; groups.push(gmap[key]); }
    if (r.factor === "なし") { hasExcluded = true; continue; }
    gmap[key].ranges.push({ f: parseFloat(r.factor), low: parseFloat(r.low), high: parseFloat(r.high) });
  }
  var out = "";
  for (var g = 0; g < groups.length; g++) {
    if (groups[g].ranges.length === 0) continue;
    out += chartBlock(groups[g], chartGroups.length);
    chartGroups.push(groups[g]);
  }
  if (out && hasExcluded) out += '<p class="chart-note">※換算係数なしの行はグラフに含んでいません。</p>';
  return out;
}


var GROUP_COLORS = [
  { main: "#34d399", dark: "#0a382a", light: "#6ee7b7" },
  { main: "#38bdf8", dark: "#0c2e42", light: "#7dd3fc" },
  { main: "#fb923c", dark: "#402106", light: "#fdba74" },
  { main: "#a78bfa", dark: "#2a1e4a", light: "#c4b5fd" },
  { main: "#f472b6", dark: "#42102a", light: "#f9a8d4" },
  { main: "#facc15", dark: "#403704", light: "#fde047" },
  { main: "#f87171", dark: "#5a2028", light: "#fca5a5" },
  { main: "#a3e635", dark: "#2a3d08", light: "#bef264" },
  { main: "#818cf8", dark: "#232550", light: "#a5b4fc" },
  { main: "#94a3b8", dark: "#1e293b", light: "#cbd5e1" }
];

function groupStats(idxs, ranges) {
  var wmin = -Infinity, wmax = Infinity;
  for (var k = 0; k < idxs.length; k++) {
    var cr = ranges[idxs[k]];
    if (cr.low > wmin) wmin = cr.low;
    if (cr.high < wmax) wmax = cr.high;
  }
  var rec = trunc2(wmax - (wmax - wmin) * 0.1);
  var fs = [];
  for (var m = 0; m < idxs.length; m++) {
    var fv = ranges[idxs[m]].f;
    if (fs.indexOf(fv) === -1) fs.push(fv);
  }
  fs.sort(function (a, b) { return a - b; });
  return { wmin: wmin, wmax: wmax, rec: rec, factors: fs, count: idxs.length, idxs: idxs.slice() };
}

function groupMinPos(g, ranges) {
  var minPos = Infinity;
  for (var i = 0; i < g.idxs.length; i++) {
    var r = ranges[g.idxs[i]];
    var pos = (g.rec - r.low) / (r.high - r.low);
    if (pos < minPos) minPos = pos;
  }
  return minPos;
}

function splitGroup(g, ranges, threshold, out) {
  var minPos = groupMinPos(g, ranges);
  if (g.idxs.length < 2 || minPos >= threshold) { out.push(g); return; }
  var sorted = g.idxs.slice().sort(function (a, b) { return ranges[a].f - ranges[b].f; });
  var best = null;
  for (var s = 1; s < sorted.length; s++) {
    var g1 = groupStats(sorted.slice(0, s), ranges);
    var g2 = groupStats(sorted.slice(s), ranges);
    if (g1.wmin > g1.wmax || g2.wmin > g2.wmax) continue;
    var worst = Math.min(groupMinPos(g1, ranges), groupMinPos(g2, ranges));
    if (!best || worst > best.worst) best = { worst: worst, g1: g1, g2: g2 };
  }
  if (best && best.worst > minPos) {
    splitGroup(best.g1, ranges, threshold, out);
    splitGroup(best.g2, ranges, threshold, out);
  } else {
    out.push(g);
  }
}

function planGroups(ranges, threshold) {
  if (threshold === undefined) threshold = 0.20;
  var rest = [];
  for (var i0 = 0; i0 < ranges.length; i0++) rest.push(i0);
  var groups = [];
  while (rest.length) {
    var anchor = rest[0];
    for (var i = 1; i < rest.length; i++) if (ranges[rest[i]].low > ranges[anchor].low) anchor = rest[i];
    var p = ranges[anchor].low;
    var covered = [], next = [];
    for (var j = 0; j < rest.length; j++) {
      var r = ranges[rest[j]];
      if (r.low <= p && p <= r.high) covered.push(rest[j]); else next.push(rest[j]);
    }
    groups.push(groupStats(covered, ranges));
    rest = next;
  }
  var out = [];
  for (var q = 0; q < groups.length; q++) splitGroup(groups[q], ranges, threshold, out);
  out.sort(function (a, b) { return a.rec - b.rec; });
  return out;
}

var PATTERNS = {
  min: { label: "ガス袋最少", threshold: -1 },
  few: { label: "ガス袋少なめ", threshold: 0.20 },
  bal: { label: "バランス", threshold: 0.40 },
  top: { label: "上限寄り", threshold: 1 }
};
var PATTERN_ORDER = ["min", "few", "bal", "top"];
var DEFAULT_PATTERN = "few";
var chartPattern = {};

function renderChartSVG(grp, conc, pat) {
  var ranges = grp.ranges;
  var maxHigh = 0;
  for (var i = 0; i < ranges.length; i++) if (ranges[i].high > maxHigh) maxHigh = ranges[i].high;

  var rawMax = maxHigh * 1.22;
  var pow = Math.pow(10, Math.floor(Math.log10(rawMax)));
  var cand = [1, 2, 4, 5, 8, 10];
  var xmax = 10 * pow;
  for (var c = 0; c < cand.length; c++) { if (cand[c] * pow >= rawMax) { xmax = cand[c] * pow; break; } }

  var W = 360, L = 48, R = 352, plotW = R - L;
  function X(v) { return L + (v / xmax) * plotW; }
  var top = (conc !== null && conc <= xmax) ? 22 : 8;
  var rowH = 36, barH = 18;
  if (window.innerWidth <= 480) { rowH = 50; barH = 24; }
  var rowsH = ranges.length * rowH;
  var plans = planGroups(ranges, PATTERNS[pat || DEFAULT_PATTERN].threshold);
  var hasBand = false;
  for (var pb = 0; pb < plans.length; pb++) if (plans[pb].count >= 2) hasBand = true;
  var axisY = top + rowsH + (hasBand ? 28 : 16);
  var H = axisY + 22;

  function isHit(rg) { return conc !== null && rg.low <= conc && conc <= rg.high; }

  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block;" font-family="ui-monospace,Menlo,Consolas,monospace">';
  for (var t = 0; t <= 4; t++) {
    var tv = xmax * t / 4, tx = X(tv);
    s += '<line x1="' + tx + '" y1="' + top + '" x2="' + tx + '" y2="' + (top + rowsH) + '" stroke="#263759" stroke-width="1"/>';
    s += '<text x="' + tx + '" y="' + axisY + '" font-size="10" fill="#c8d5eb" text-anchor="middle">' + fmtF(tv) + '</text>';
  }
  if (conc !== null && conc <= xmax) {
    var cx = X(conc);
    s += '<line x1="' + cx + '" y1="' + top + '" x2="' + cx + '" y2="' + (top + rowsH) + '" stroke="#facc15" stroke-width="2" stroke-dasharray="5 4"/>';
    var lx = Math.max(L + 14, Math.min(R - 14, cx));
    s += '<text x="' + lx + '" y="' + (top - 8) + '" font-size="10.5" font-weight="bold" fill="#fde047" text-anchor="middle">' + fmtF(conc) + '</text>';
  }
  var groupOf = {};
  for (var gm = 0; gm < plans.length; gm++) {
    for (var gx = 0; gx < plans[gm].idxs.length; gx++) groupOf[plans[gm].idxs[gx]] = gm;
  }
  for (var b2 = 0; b2 < plans.length; b2++) {
    var pg = plans[b2];
    if (pg.count < 2) continue;
    var bcol = GROUP_COLORS[b2 % GROUP_COLORS.length];
    var bx1 = X(pg.wmin), bx2 = X(pg.wmax);
    s += '<rect x="' + bx1 + '" y="' + top + '" width="' + Math.max(bx2 - bx1, 1) + '" height="' + rowsH + '" fill="' + bcol.main + '" fill-opacity=".13" stroke="' + bcol.main + '" stroke-opacity=".7" stroke-width="1"/>';
    var blab = pg.wmin.toFixed(2) + "〜" + pg.wmax.toFixed(2);
    if (bx2 - bx1 > blab.length * 6 + 8) {
      s += '<text x="' + ((bx1 + bx2) / 2) + '" y="' + (top + rowsH + 13) + '" font-size="9.5" fill="' + bcol.main + '" text-anchor="middle">' + blab + '</text>';
    }
    var rcx = X(pg.rec);
    s += '<polygon points="' + (rcx - 4.5) + "," + top + " " + (rcx + 4.5) + "," + top + " " + rcx + "," + (top + 5.5) + '" fill="' + bcol.main + '"/>';
  }
  for (var i2 = 0; i2 < ranges.length; i2++) {
    var rg = ranges[i2];
    var cy = top + rowH * (i2 + 0.5);
    var hit = isHit(rg);
    var col = GROUP_COLORS[(groupOf[i2] || 0) % GROUP_COLORS.length];
    s += '<text x="' + (L - 6) + '" y="' + (cy + 4) + '" font-size="11" font-weight="bold" fill="' + (hit ? "#fde047" : col.light) + '" text-anchor="end">' + fmtF(rg.f) + '</text>';
    var x1 = X(rg.low), x2 = X(rg.high);
    if (hit) {
      s += '<rect x="' + (x1 - 3.5) + '" y="' + (cy - barH / 2 - 3.5) + '" width="' + (x2 - x1 + 7) + '" height="' + (barH + 7) + '" rx="9" fill="none" stroke="#facc15" stroke-width="2.5"/>';
    }
    s += '<rect x="' + x1 + '" y="' + (cy - barH / 2) + '" width="' + Math.max(x2 - x1, 2) + '" height="' + barH + '" rx="7" fill="' + col.dark + '" stroke="' + col.main + '" stroke-width="1.5"/>';
    s += '<circle cx="' + x1 + '" cy="' + cy + '" r="3" fill="' + col.main + '"/>';
    s += '<circle cx="' + x2 + '" cy="' + cy + '" r="3" fill="' + col.main + '"/>';
    if (x1 - L < 40) {
      s += '<text x="' + x1 + '" y="' + (cy - barH / 2 - 4) + '" font-size="10.5" fill="' + col.light + '" text-anchor="start">' + rg.low.toFixed(2) + '</text>';
    } else {
      s += '<text x="' + (x1 - 5) + '" y="' + (cy + 4) + '" font-size="10.5" fill="' + col.light + '" text-anchor="end">' + rg.low.toFixed(2) + '</text>';
    }
    s += '<text x="' + (x2 + 5) + '" y="' + (cy + 4) + '" font-size="10.5" fill="' + col.light + '" text-anchor="start">' + rg.high.toFixed(2) + '</text>';
  }
  s += '<text transform="translate(13,' + (top + rowsH / 2) + ') rotate(-90)" font-size="11" fill="#c8d5eb" text-anchor="middle">換算係数</text>';
  s += '<text x="' + ((L + R) / 2) + '" y="' + (axisY + 18) + '" font-size="11" fill="#c8d5eb" text-anchor="middle">校正ガス濃度</text>';
  s += "</svg>";
  return s;
}

function planBoxHtml(plans, pat) {
  var marks = ["①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧", "⑨", "⑩"];
  var planHtml = '<div class="plan-box"><div class="plan-head">まとめ（' + PATTERNS[pat].label + '）：校正ガス濃度は ' + plans.length + 'つ でOK</div>';
  for (var pi = 0; pi < plans.length; pi++) {
    var pg2 = plans[pi];
    var mark = pi < marks.length ? marks[pi] : "(" + (pi + 1) + ")";
    var flist = "";
    for (var fi = 0; fi < pg2.factors.length; fi++) flist += (fi ? "、" : "") + fmtF(pg2.factors[fi]);
    var pcol = GROUP_COLORS[pi % GROUP_COLORS.length];
    planHtml += '<div class="plan-line"><span style="color:' + pcol.light + '">' + mark + ' 校正ガス濃度 <b>' + pg2.rec.toFixed(2) + "</b></span> → 係数 " + flist + '<span style="white-space:nowrap">（合計' + pg2.count + "点）</span></div>";
  }
  planHtml += "</div>";
  return planHtml;
}

var PLAN_MARKS = ["①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧", "⑨", "⑩"];
// グラフ・まとめと同じ planGroups の分け方で、換算係数→まとめ番号・色を返す。
// キーは fmtF(換算係数)。まとめ番号・色はグラフの帯・横棒・まとめ行と同一。
function groupColorFor(grp, pat) {
  var plans = planGroups(grp.ranges, PATTERNS[pat || DEFAULT_PATTERN].threshold);
  var map = {};
  for (var pi = 0; pi < plans.length; pi++) {
    for (var xi = 0; xi < plans[pi].idxs.length; xi++) {
      var rg = grp.ranges[plans[pi].idxs[xi]];
      map[fmtF(rg.f)] = { idx: pi, mark: pi < PLAN_MARKS.length ? PLAN_MARKS[pi] : "(" + (pi + 1) + ")", col: GROUP_COLORS[pi % GROUP_COLORS.length] };
    }
  }
  return map;
}
// パターン切替時に、同じガスブロック内の一覧の色・まとめ番号だけを塗り直す。
// CSV・コピー用テキスト・グラフPNGには影響しない。
function recolorGasList(gasBlock, grp, pat) {
  if (!gasBlock || !grp) return;
  var cmap = groupColorFor(grp, pat);
  var trs = gasBlock.querySelectorAll("table tr[data-first]");
  for (var i = 0; i < trs.length; i++) {
    var tr = trs[i];
    if (String(tr.getAttribute("data-first")) !== String(grp.first)) continue;
    var f = tr.getAttribute("data-factor");
    if (!f || f === "なし") continue;
    var e = cmap[fmtF(parseFloat(f))];
    if (!e) continue;
    var tds = tr.querySelectorAll("td");
    for (var d = 0; d < tds.length; d++) tds[d].style.background = e.col.dark;
    var gTd = tr.querySelector("td.grp-cell");
    if (gTd) {
      gTd.innerHTML = '<span style="color:' + e.col.light + '">' + e.mark + "</span>";
    }
  }
}

function chartBlock(grp, idx) {
  chartPattern[idx] = DEFAULT_PATTERN;
  var patHtml = '<div class="pattern-row">';
  for (var pk = 0; pk < PATTERN_ORDER.length; pk++) {
    var key = PATTERN_ORDER[pk];
    var cnt = planGroups(grp.ranges, PATTERNS[key].threshold).length;
    patHtml += '<button type="button" class="pattern-btn' + (key === DEFAULT_PATTERN ? " active" : "") + '" data-pat="' + key + '">' + PATTERNS[key].label + '（' + cnt + 'つ）</button>';
  }
  patHtml += "</div>";
  var plansDef = planGroups(grp.ranges, PATTERNS[DEFAULT_PATTERN].threshold);
  return '<div class="chart-block" data-gidx="' + idx + '">' +
    '<div class="chart-title">' + grp.name + " ・ 1st = " + grp.first + '</div>' +
    '<div class="chart-note">横棒：その係数で使える濃度範囲<br>帯：まとめて校正できる共通範囲（まとめと同色）</div>' +
    '<div class="conc-row"><label>今のガス濃度は？</label><input type="number" class="conc-input" step="any" inputmode="decimal" placeholder="濃度"></div>' +
    '<div class="conc-result" style="display:none;"></div>' +
    '<div class="svg-wrap">' + renderChartSVG(grp, null, DEFAULT_PATTERN) + "</div>" + patHtml +
    '<div class="plan-wrap">' + planBoxHtml(plansDef, DEFAULT_PATTERN) + "</div></div>";
}

function bindPatternBtns() {
  var btns = document.querySelectorAll(".pattern-btn");
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener("click", function () {
      var block = this.closest(".chart-block");
      var gidx = Number(block.getAttribute("data-gidx"));
      var grp = chartGroups[gidx];
      var pat = this.getAttribute("data-pat");
      chartPattern[gidx] = pat;
      var siblings = block.querySelectorAll(".pattern-btn");
      for (var s = 0; s < siblings.length; s++) siblings[s].classList.toggle("active", siblings[s] === this);
      var inp = block.querySelector(".conc-input");
      var raw = inp ? inp.value.trim() : "";
      var v = parseFloat(raw);
      var conc = (raw !== "" && !isNaN(v)) ? v : null;
      block.querySelector(".svg-wrap").innerHTML = renderChartSVG(grp, conc, pat);
      block.querySelector(".plan-wrap").innerHTML = planBoxHtml(planGroups(grp.ranges, PATTERNS[pat].threshold), pat);
      recolorGasList(block.closest(".gas-block"), grp, pat);
    });
  }
}

function bindConcInputs() {
  var inputs = document.querySelectorAll(".conc-input");
  for (var i = 0; i < inputs.length; i++) {
    inputs[i].addEventListener("input", function () {
      if (this.value.indexOf("-") !== -1) this.value = this.value.replace(/-/g, "");
      var block = this.closest(".chart-block");
      var gidx2 = Number(block.getAttribute("data-gidx"));
      var grp = chartGroups[gidx2];
      var pat2 = chartPattern[gidx2] || DEFAULT_PATTERN;
      var result = block.querySelector(".conc-result");
      var wrap = block.querySelector(".svg-wrap");
      var raw = this.value.trim();
      var v = parseFloat(raw);
      if (raw === "" || isNaN(v)) {
        result.style.display = "none";
        wrap.innerHTML = renderChartSVG(grp, null, pat2);
        return;
      }
      var fmin = null, fmax = null;
      for (var j = 0; j < grp.ranges.length; j++) {
        var rg = grp.ranges[j];
        if (rg.low <= v && v <= rg.high) {
          if (fmin === null || rg.f < fmin) fmin = rg.f;
          if (fmax === null || rg.f > fmax) fmax = rg.f;
        }
      }
      result.style.display = "block";
      if (fmin === null) {
        result.className = "conc-result none";
        result.textContent = "濃度 " + raw + " → 校正できる換算係数はありません";
      } else {
        result.className = "conc-result";
        var fr = fmin === fmax ? fmtF(fmin) : fmtF(fmin) + "〜" + fmtF(fmax);
        result.innerHTML = "濃度 " + raw + ' → 換算係数 <span class="cf">' + fr + "</span> が校正できます";
      }
      wrap.innerHTML = renderChartSVG(grp, v, pat2);
    });
  }
}

var lastExport = [];

var gasData = [];

      html += chartHtml;
      html += '<div><button type="button" class="gas-csv" data-gi="' + gi + '">一覧をCSVで保存</button>' +
        '<button type="button" class="gas-copy" data-gi="' + gi + '">一覧のテキストをコピー</button>' +
        '<button type="button" class="gas-table-img" data-gi="' + gi + '">一覧を画像で保存</button>' +
        '<button type="button" class="gas-graph" data-gi="' + gi + '">グラフを画像で保存</button></div>';
      html += "</div>";
    }
    body.innerHTML = html;
    bindConcInputs();
    bindPatternBtns();
    var csvBtns = panel.querySelectorAll(".gas-csv");
    for (var a = 0; a < csvBtns.length; a++) csvBtns[a].addEventListener("click", function () { downloadGasCSV(gasData[Number(this.getAttribute("data-gi"))]); });
    var copyBtns = panel.querySelectorAll(".gas-copy");
    for (var b = 0; b < copyBtns.length; b++) copyBtns[b].addEventListener("click", function () { copyGasText(gasData[Number(this.getAttribute("data-gi"))]); });
    var graphBtns = panel.querySelectorAll(".gas-graph");
    for (var c = 0; c < graphBtns.length; c++) graphBtns[c].addEventListener("click", function () {
      var gi2 = Number(this.getAttribute("data-gi"));
      saveGasGraph(this.closest(".gas-block"), gasData[gi2].name);
    });
    var timgBtns = panel.querySelectorAll(".gas-table-img");
    for (var d2 = 0; d2 < timgBtns.length; d2++) timgBtns[d2].addEventListener("click", function () { saveGasTableImage(gasData[Number(this.getAttribute("data-gi"))]); });
  }
  panel.style.display = "block";
  panel.scrollIntoView({ behavior: "smooth" });
});

function stampNow() {
  var now = new Date();
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  return now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + pad(now.getHours()) + pad(now.getMinutes());
}

function downloadGasCSV(gd) {
  if (!gd || !gd.rows.length) return;
  var gmap = gasGroupMap(gd);
  var lines = ["No,ガス名,1st,係数,1st×1.12〜,〜1st×1.6"];
  for (var i = 0; i < gd.rows.length; i++) {
    var r = gd.rows[i];
    var ge = groupEntryFor(gmap, r);
    var nm = '"' + String(r.name).replace(/"/g, '""') + '"';
    lines.push((ge ? ge.mark : "") + "," + nm + "," + r.first + "," + r.factor + "," + r.low + "," + r.high);
  }
  var blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = stampNow() + "_kosei-gas-list_" + safeName(gd.name) + ".csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

function copyGasText(gd) {
  if (!gd || !gd.rows.length) return;
  var gmap = gasGroupMap(gd);
  var lines = ["校正ガス濃度 一覧"];
  for (var i = 0; i < gd.rows.length; i++) {
    var r = gd.rows[i];
    var ge = groupEntryFor(gmap, r);
    lines.push((ge ? ge.mark + " " : "") + r.name + "　1st：" + r.first + "　係数：" + r.factor + "　1st×1.12〜：" + r.low + "　〜1st×1.6：" + r.high);
  }
  var text = lines.join("\n");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { alert("コピーしました"); });
  } else {
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    alert("コピーしました");
  }
}

// そのガスの「現在のパターン選択」に基づくグループ対応表。
// CSV・テキストコピー・一覧画像で共用し、画面の一覧表示と常に一致させる。
function gasGroupMap(gd) {
  var map = {};
  if (!gd || !gd.gidxs) return map;
  for (var i = 0; i < gd.gidxs.length; i++) {
    var grp = chartGroups[gd.gidxs[i]];
    if (!grp) continue;
    var gm = groupColorFor(grp, chartPattern[gd.gidxs[i]] || DEFAULT_PATTERN);
    for (var fk in gm) map[grp.first + "|" + fk] = gm[fk];
  }
  return map;
}
function groupEntryFor(gmap, r) {
  if (!r || r.factor === "なし") return null;
  return gmap[r.first + "|" + fmtF(parseFloat(r.factor))] || null;
}

// 一覧表を色付きのままPNG画像で保存する（画面の色分けを再現して描画）。
function saveGasTableImage(gd) {
  if (!gd || !gd.rows.length) return;
  var gmap = gasGroupMap(gd);
  var W = 720, pad = 24;
  var tableW = W - pad * 2;
  var cols = [0.13, 0.16, 0.11, 0.19, 0.20, 0.21];
  var colX = [pad];
  for (var ci = 0; ci < cols.length; ci++) colX.push(colX[ci] + Math.round(tableW * cols[ci]));
  colX[cols.length] = pad + tableW;
  var titleH = 40, headH = 38, rowH = 38;
  var tableH = headH + rowH * gd.rows.length;
  var H = pad + titleH + tableH + pad;
  var canvas = document.createElement("canvas");
  var scale = 2;
  canvas.width = W * scale;
  canvas.height = H * scale;
  var ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);
  ctx.fillStyle = "#0a1120";
  ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = "middle";
  ctx.font = "bold 20px sans-serif";
  ctx.textAlign = "left";
  ctx.fillStyle = "#e8eef7";
  ctx.fillText("校正ガス濃度一覧 ", pad, pad + titleH / 2);
  var tw = ctx.measureText("校正ガス濃度一覧 ").width;
  ctx.fillStyle = "#facc15";
  ctx.fillText(gd.name, pad + tw, pad + titleH / 2);
  var y = pad + titleH;
  ctx.fillStyle = "#122544";
  ctx.fillRect(pad, y, tableW, headH);
  var heads = ["No", "ガス名", "1st", "係数", "1st×1.12〜", "〜1st×1.6"];
  ctx.font = "bold 14px sans-serif";
  ctx.fillStyle = "#bfe0ff";
  for (var h = 0; h < heads.length; h++) {
    var hx = colX[h], hw = colX[h + 1] - colX[h];
    if (h === 0 || h === 2) { ctx.textAlign = "center"; ctx.fillText(heads[h], hx + hw / 2, y + headH / 2); }
    else if (h === 1) { ctx.textAlign = "left"; ctx.fillText(heads[h], hx + 10, y + headH / 2); }
    else { ctx.textAlign = "right"; ctx.fillText(heads[h], hx + hw - 10, y + headH / 2); }
  }
  y += headH;
  for (var i = 0; i < gd.rows.length; i++) {
    var r = gd.rows[i];
    var ge = groupEntryFor(gmap, r);
    ctx.fillStyle = ge ? ge.col.dark : "#101a30";
    ctx.fillRect(pad, y, tableW, rowH);
    var cy = y + rowH / 2;
    ctx.textAlign = "center";
    ctx.font = "bold 17px sans-serif";
    if (ge) { ctx.fillStyle = ge.col.light; ctx.fillText(ge.mark, colX[0] + (colX[1] - colX[0]) / 2, cy); }
    else if (r.factor === "なし") { ctx.fillStyle = "#93a5c4"; ctx.fillText("－", colX[0] + (colX[1] - colX[0]) / 2, cy); }
    ctx.textAlign = "left";
    ctx.font = "bold 15px sans-serif";
    ctx.fillStyle = "#facc15";
    ctx.fillText(r.name, colX[1] + 10, cy);
    ctx.textAlign = "center";
    ctx.font = "15px monospace";
    ctx.fillStyle = "#e8eef7";
    ctx.fillText(String(r.first), colX[2] + (colX[3] - colX[2]) / 2, cy);
    ctx.textAlign = "right";
    ctx.fillText(String(r.factor), colX[4] - 10, cy);
    ctx.font = "bold 15px monospace";
    ctx.fillStyle = "#f87171";
    ctx.fillText(String(r.low), colX[5] - 10, cy);
    ctx.fillText(String(r.high), colX[6] - 10, cy);
    y += rowH;
  }
  ctx.strokeStyle = "#26375a";
  ctx.lineWidth = 1;
  ctx.strokeRect(pad, pad + titleH, tableW, tableH);
  ctx.beginPath();
  var yy = pad + titleH + headH;
  for (var li = 0; li < gd.rows.length; li++) { ctx.moveTo(pad, yy); ctx.lineTo(pad + tableW, yy); yy += rowH; }
  for (var vi = 1; vi < colX.length - 1; vi++) { ctx.moveTo(colX[vi], pad + titleH); ctx.lineTo(colX[vi], pad + titleH + tableH); }
  ctx.stroke();
  var a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = stampNow() + "_kosei-gas-table_" + safeName(gd.name) + ".png";
  a.click();
}

function saveGasGraph(blockEl, gasName) {
  var blocks = blockEl ? blockEl.querySelectorAll(".chart-block") : [];
  if (!blocks.length) { alert("グラフがありません"); return; }
  var W = 760, pad = 28, gap = 30;
  var items = [];
  var totalH = pad;
  for (var i = 0; i < blocks.length; i++) {
    var b = blocks[i];
    var svg = b.querySelector("svg");
    var vb = svg.getAttribute("viewBox").split(/\s+/).map(Number);
    var svgH = (W - pad * 2) * vb[3] / vb[2];
    var res = b.querySelector(".conc-result");
    var resText = (res && res.style.display !== "none") ? res.textContent : "";
    var planHead = b.querySelector(".plan-head");
    var planLines = [];
    var plEls = b.querySelectorAll(".plan-line");
    for (var q = 0; q < plEls.length; q++) planLines.push(plEls[q].textContent);
    var planH = planHead ? (30 + planLines.length * 25 + 6) : 0;
    var h = 34 + (resText ? 30 : 0) + 8 + svgH + planH;
    items.push({ title: b.querySelector(".chart-title").textContent, svg: svg, svgH: svgH, resText: resText, planHead: planHead ? planHead.textContent : "", planLines: planLines, planH: planH, h: h });
    totalH += h + gap;
  }
  totalH += pad - gap;
  var canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = Math.ceil(totalH);
  var ctx = canvas.getContext("2d");
  ctx.fillStyle = "#0a1120";
  ctx.fillRect(0, 0, W, canvas.height);
  var y = pad;
  var pending = items.length;
  items.forEach(function (it) {
    var yy = y;
    if (ctx.roundRect) {
      ctx.fillStyle = "#111c30";
      ctx.beginPath();
      ctx.roundRect(8, yy - 14, W - 16, it.h + 24, 14);
      ctx.fill();
    }
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 21px sans-serif";
    ctx.textBaseline = "top";
    ctx.fillText(it.title, pad, yy);
    yy += 34;
    if (it.resText) {
      ctx.fillStyle = "#fde047";
      ctx.font = "bold 17px sans-serif";
      ctx.fillText(it.resText, pad, yy);
      yy += 30;
    }
    yy += 8;
    if (it.planHead) {
      var py = yy + it.svgH + 10;
      ctx.fillStyle = "#34d399";
      ctx.font = "bold 17px sans-serif";
      ctx.fillText(it.planHead, pad, py);
      py += 30;
      ctx.font = "15px sans-serif";
      for (var li = 0; li < it.planLines.length; li++) {
        ctx.fillStyle = GROUP_COLORS[li % GROUP_COLORS.length].light;
        var fs = 15;
        ctx.font = fs + "px sans-serif";
        while (ctx.measureText(it.planLines[li]).width > W - pad * 2 && fs > 10) { fs--; ctx.font = fs + "px sans-serif"; }
        ctx.fillText(it.planLines[li], pad, py);
        py += 25;
      }
    }
    var xml = new XMLSerializer().serializeToString(it.svg);
    if (xml.indexOf("xmlns=") === -1) xml = xml.replace("<svg", '<svg xmlns="http://www.w3.org/2000/svg"');
    var url = URL.createObjectURL(new Blob([xml], { type: "image/svg+xml;charset=utf-8" }));
    var img = new Image();
    img.onload = function () {
      ctx.drawImage(img, pad, yy, W - pad * 2, it.svgH);
      URL.revokeObjectURL(url);
      if (--pending === 0) {
        var a = document.createElement("a");
        a.href = canvas.toDataURL("image/png");
        a.download = stampNow() + "_kosei-gas-graph_" + safeName(gasName) + ".png";
        a.click();
      }
    };
    img.src = url;
    y += it.h + gap;
  });
}
