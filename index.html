<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校正ガス濃度 計算ツール</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1120">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  * { box-sizing: border-box; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; margin: 0 auto; max-width: 600px; padding: 20px 16px 32px; background: linear-gradient(180deg, #0a1120 0%, #0d1830 60%, #0a1428 100%); background-attachment: fixed; color: #e8eef7; min-height: 100vh; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: .06em; background: linear-gradient(90deg, #7dd3fc, #38bdf8 45%, #2dd4bf); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .sub { font-size: 13px; color: #93a5c4; margin-bottom: 18px; line-height: 1.7; }
  .card { background: linear-gradient(180deg, #16233c, #111c30); border: 1px solid #26375a; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .row-title { font-weight: bold; font-size: 15px; color: #bfe0ff; letter-spacing: .08em; }
  .del-btn { background: transparent; color: #f87171; border: 1px solid #7f2d3a; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .del-btn:active { background: rgba(248,113,113,.15); }
  label { display: block; font-size: 12px; color: #9fb0c9; margin: 12px 0 5px; letter-spacing: .05em; }
  select, input[type="number"], input[type="text"] { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #2b3c5c; border-radius: 10px; background: #0b1425; color: #eef4ff; }
  select:focus, input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,.25); }
  #rows .card { overflow: hidden; }
  #rows .card::before { content: ""; display: block; height: 12px; margin: -16px -16px 14px; background: repeating-linear-gradient(45deg, #facc15 0 14px, #141414 14px 28px); }
  .result { margin-top: 16px; background: #0a1322; border: 1px solid rgba(248,113,113,.4); border-radius: 12px; padding: 14px; box-shadow: inset 0 0 24px rgba(248,113,113,.07); }
  .result .cap { font-size: 13px; color: #fca5a5; font-weight: bold; letter-spacing: .1em; margin-bottom: 10px; }
  .result .vals { display: flex; gap: 10px; flex-wrap: wrap; }
  .result .val { flex: 1; min-width: 130px; border-radius: 10px; padding: 12px 14px; }
  .val-low { background: linear-gradient(180deg, rgba(248,113,113,.16), rgba(248,113,113,.05)); border: 1.5px solid rgba(248,113,113,.65); }
  .val-high { background: linear-gradient(180deg, rgba(248,113,113,.16), rgba(248,113,113,.05)); border: 1.5px solid rgba(248,113,113,.65); }
  .result .val .k { font-size: 12px; color: #aebdd6; }
  .val .k { white-space: nowrap; }
  .result .val .v { font-size: 36px; font-weight: bold; font-family: "Roboto Mono", "SF Mono", Consolas, monospace; letter-spacing: .02em; line-height: 1.25; }
  .v-low { color: #f87171; text-shadow: 0 0 16px rgba(248,113,113,.55); }
  .v-high { color: #f87171; text-shadow: 0 0 16px rgba(248,113,113,.55); }
  .result .none { font-size: 14px; color: #888; }
  #addBtn { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; letter-spacing: .05em; background: linear-gradient(90deg, #2563eb, #0ea5e9); color: #fff; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 14px rgba(14,165,233,.35); }
  #exportBtn { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; letter-spacing: .05em; background: linear-gradient(90deg, #059669, #10b981); color: #fff; border: none; border-radius: 12px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 14px rgba(16,185,129,.3); }
  #addBtn:active, #exportBtn:active { transform: translateY(1px); }
  #exportPanel table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #exportPanel th, #exportPanel td { border: 1px solid #26375a; padding: 7px 4px; text-align: right; white-space: nowrap; }
  #exportPanel th { background: #122544; color: #bfe0ff; }
  #exportPanel td { font-family: "Roboto Mono", Consolas, monospace; }
  #exportPanel td.num-low { color: #f87171; font-weight: bold; font-size: 14px; }
  #exportPanel td.num-high { color: #f87171; font-weight: bold; font-size: 14px; }
  #exportPanel td:first-child { font-family: inherit; }
  #exportPanel th:first-child, #exportPanel td:first-child { text-align: left; }
  #csvBtn, #copyBtn { padding: 10px 14px; font-size: 14px; border-radius: 10px; border: 1px solid #10b981; background: transparent; color: #34d399; cursor: pointer; margin-top: 12px; margin-right: 8px; }
  #csvBtn:active, #copyBtn:active { background: rgba(16,185,129,.15); }
  #resetBtn { width: 100%; padding: 12px; font-size: 14px; background: transparent; color: #aebdd6; border: 1px solid #3b4c6b; border-radius: 12px; cursor: pointer; margin-top: 10px; }
  .note { font-size: 12px; color: #7e90ad; margin-top: 20px; line-height: 1.8; border-top: 1px solid #22345a; padding-top: 14px; }

  .factor-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .factor-row input { flex: 1; }
  .factor-del { background: transparent; color: #f87171; border: 1px solid #7f2d3a; border-radius: 8px; width: 42px; height: 46px; font-size: 16px; cursor: pointer; flex: none; }
  .add-factor-btn { background: transparent; color: #7dd3fc; border: 1px dashed #2b3c5c; border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
  .fgroup + .fgroup { margin-top: 12px; border-top: 1px dashed #26375a; padding-top: 10px; }
  .fcap { font-size: 12px; color: #fca5a5; font-weight: bold; letter-spacing: .06em; margin-bottom: 6px; }
  .result .none { color: #93a5c4; font-size: 14px; }
</style>
</head>
<body>

<h1>校正ガス濃度 計算ツール</h1>
<div class="sub">
  1stを入力すると、校正に使用できるガス濃度を表示します。<br>
  換算係数がある場合は、換算係数も入力してください。
</div>

<div id="rows"></div>

<button id="addBtn">＋ 行を追加</button>
<button id="exportBtn">出力する</button>
<button id="resetBtn">すべてクリア</button>

<div id="exportPanel" class="card" style="display:none;">
  <div class="row-head"><span class="row-title">校正ガス濃度 一覧</span></div>
  <div id="exportBody"></div>
  <button id="csvBtn" type="button">CSVで保存</button>
  <button id="copyBtn" type="button">テキストをコピー</button>
</div>

<div class="note">
  計算式<br>
  ・換算係数が無い時：校正ガス濃度 ＝ 1st × 1.12〜1.6<br>
  ・換算係数が有る時：校正ガス濃度 ＝ 1st × 1.12〜1.6 ÷ 換算係数<br>
  ※結果は四捨五入せず、小数第3位以下を切り捨てて小数第2位まで表示します。<br>
  ※出力の一覧は、ガス名の順 → 換算係数の大きい順に並び替えて表示します。
</div>

<script>
var GASES = ["B2H6", "CLF3", "DIPAS", "F2", "HBR", "HF", "O3", "Si2H6"];

function trunc2(n) {
  return Math.floor(n * 100 + 1e-9) / 100;
}
function fmt(n) {
  if (!isFinite(n)) return "―";
  return trunc2(n).toFixed(2);
}

function makeFactorRow(card) {
  var row = document.createElement("div");
  row.className = "factor-row";
  row.innerHTML =
    '<input type="number" class="in-factor" inputmode="decimal" step="any" placeholder="例：0.95">' +
    '<button type="button" class="factor-del" style="display:none;">×</button>';
  row.querySelector(".in-factor").addEventListener("input", function () { calc(card); });
  row.querySelector(".factor-del").addEventListener("click", function () {
    row.remove();
    syncFactorDel(card);
    calc(card);
  });
  return row;
}

function syncFactorDel(card) {
  var rows = card.querySelectorAll(".factor-row");
  for (var i = 0; i < rows.length; i++) {
    rows[i].querySelector(".factor-del").style.display = rows.length > 1 ? "block" : "none";
  }
}

function getFactors(card) {
  var inputs = card.querySelectorAll(".in-factor");
  var eff = [];
  for (var i = 0; i < inputs.length; i++) {
    var v = inputs[i].value.trim();
    if (v !== "") eff.push(v);
  }
  return eff;
}

function makeRow() {
  var card = document.createElement("div");
  card.className = "card";

  var options = '<option value="">（ガス名を選択）</option>';
  for (var i = 0; i < GASES.length; i++) {
    options += '<option value="' + GASES[i] + '">' + GASES[i] + "</option>";
  }
  options += '<option value="__other__">その他（自由入力）</option>';

  card.innerHTML =
    '<div class="row-head"><span class="row-title">ガス</span>' +
    '<button class="del-btn" type="button">削除</button></div>' +
    '<label>ガス名</label>' +
    '<select class="gas-sel">' + options + "</select>" +
    '<input type="text" class="gas-free" placeholder="ガス名を入力" style="display:none;margin-top:8px;">' +
    '<label>1st</label>' +
    '<input type="number" class="in-first" inputmode="decimal" step="any" placeholder="例：25">' +
    '<label>換算係数（無い場合は空欄）</label>' +
    '<div class="factors"></div>' +
    '<button type="button" class="add-factor-btn">＋ 換算係数を追加</button>' +
    '<div class="result"><div class="cap">校正に使用できるガス濃度</div>' +
    '<div class="groups">' +
    '<div class="fgroup"><div class="vals">' +
    '<div class="val val-low"><div class="k">1st×1.12〜</div><div class="v v-low">―</div></div>' +
    '<div class="val val-high"><div class="k">〜1st×1.6</div><div class="v v-high">―</div></div>' +
    "</div></div>" +
    "</div></div>";

  card.querySelector(".factors").appendChild(makeFactorRow(card));

  var sel = card.querySelector(".gas-sel");
  var free = card.querySelector(".gas-free");
  sel.addEventListener("change", function () {
    free.style.display = (sel.value === "__other__") ? "block" : "none";
  });

  card.querySelector(".del-btn").addEventListener("click", function () {
    card.remove();
  });

  card.querySelector(".add-factor-btn").addEventListener("click", function () {
    card.querySelector(".factors").appendChild(makeFactorRow(card));
    syncFactorDel(card);
  });

  card.querySelector(".in-first").addEventListener("input", function () { calc(card); });
  return card;
}

function calc(card) {
  var first = parseFloat(card.querySelector(".in-first").value);
  var groupsEl = card.querySelector(".groups");

  if (isNaN(first)) {
    groupsEl.innerHTML =
      '<div class="fgroup"><div class="vals">' +
      '<div class="val val-low"><div class="k">1st×1.12〜</div><div class="v v-low">―</div></div>' +
      '<div class="val val-high"><div class="k">〜1st×1.6</div><div class="v v-high">―</div></div>' +
      "</div></div>";
    return;
  }

  var eff = getFactors(card);
  var list = eff.length ? eff : [null];
  var html = "";
  for (var i = 0; i < list.length; i++) {
    var f = list[i];
    var low = first * 1.12;
    var high = first * 1.6;
    var cap = "";
    var lowTxt, highTxt;
    if (f === null) {
      lowTxt = fmt(low);
      highTxt = fmt(high);
    } else {
      var fv = parseFloat(f);
      cap = '<div class="fcap">換算係数 ' + f + "</div>";
      if (isNaN(fv) || fv === 0) {
        lowTxt = "係数0は不可";
        highTxt = "係数0は不可";
      } else {
        lowTxt = fmt(low / fv);
        highTxt = fmt(high / fv);
      }
    }
    html += '<div class="fgroup">' + cap + '<div class="vals">' +
      '<div class="val val-low"><div class="k">1st×1.12〜</div><div class="v v-low">' + lowTxt + "</div></div>" +
      '<div class="val val-high"><div class="k">〜1st×1.6</div><div class="v v-high">' + highTxt + "</div></div>" +
      "</div></div>";
  }
  groupsEl.innerHTML = html;
}

document.getElementById("addBtn").addEventListener("click", function () {
  document.getElementById("rows").appendChild(makeRow());
});

function collectResults() {
  var cards = document.querySelectorAll("#rows .card");
  var list = [];
  for (var i = 0; i < cards.length; i++) {
    var card = cards[i];
    var first = parseFloat(card.querySelector(".in-first").value);
    if (isNaN(first)) continue;
    var sel = card.querySelector(".gas-sel");
    var name = "";
    if (sel.value === "__other__") {
      name = card.querySelector(".gas-free").value.trim();
    } else {
      name = sel.value;
    }
    if (!name) name = "（名称なし）";
    var eff = getFactors(card);
    var flist = eff.length ? eff : [null];
    for (var j = 0; j < flist.length; j++) {
      var f = flist[j];
      var low = first * 1.12;
      var high = first * 1.6;
      var sk = -1e18;
      var fDisp = "なし";
      if (f !== null) {
        var fv = parseFloat(f);
        if (isNaN(fv) || fv === 0) continue;
        low = low / fv;
        high = high / fv;
        sk = fv;
        fDisp = f;
      }
      list.push({
        name: name,
        first: first,
        factor: fDisp,
        sk: sk,
        low: trunc2(low).toFixed(2),
        high: trunc2(high).toFixed(2)
      });
    }
  }
  list.sort(function (a, b) {
    if (a.name < b.name) return -1;
    if (a.name > b.name) return 1;
    return b.sk - a.sk;
  });
  return list;
}

var lastExport = [];

document.getElementById("exportBtn").addEventListener("click", function () {
  lastExport = collectResults();
  var panel = document.getElementById("exportPanel");
  var body = document.getElementById("exportBody");
  if (lastExport.length === 0) {
    body.innerHTML = '<p style="font-size:14px;color:#93a5c4;">1stが入力されている行がありません。</p>';
    document.getElementById("csvBtn").style.display = "none";
    document.getElementById("copyBtn").style.display = "none";
  } else {
    var html = "<table><tr><th>ガス名</th><th>1st</th><th>換算係数</th><th>1st×1.12〜</th><th>〜1st×1.6</th></tr>";
    for (var i = 0; i < lastExport.length; i++) {
      var r = lastExport[i];
      html += "<tr><td>" + r.name + "</td><td>" + r.first + "</td><td>" + r.factor + "</td><td class=\"num-low\">" + r.low + "</td><td class=\"num-high\">" + r.high + "</td></tr>";
    }
    html += "</table>";
    body.innerHTML = html;
    document.getElementById("csvBtn").style.display = "";
    document.getElementById("copyBtn").style.display = "";
  }
  panel.style.display = "block";
  panel.scrollIntoView({ behavior: "smooth" });
});

document.getElementById("csvBtn").addEventListener("click", function () {
  if (lastExport.length === 0) return;
  var lines = ["ガス名,1st,換算係数,1st×1.12〜,〜1st×1.6"];
  for (var i = 0; i < lastExport.length; i++) {
    var r = lastExport[i];
    var nm = '"' + String(r.name).replace(/"/g, '""') + '"';
    lines.push(nm + "," + r.first + "," + r.factor + "," + r.low + "," + r.high);
  }
  var blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv" });
  var now = new Date();
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  var stamp = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + pad(now.getHours()) + pad(now.getMinutes());
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = stamp + "_kosei-gas-list.csv";
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById("copyBtn").addEventListener("click", function () {
  if (lastExport.length === 0) return;
  var lines = ["校正ガス濃度 一覧"];
  for (var i = 0; i < lastExport.length; i++) {
    var r = lastExport[i];
    lines.push(r.name + "　1st：" + r.first + "　換算係数：" + r.factor + "　1st×1.12〜：" + r.low + "　〜1st×1.6：" + r.high);
  }
  var text = lines.join("\n");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { alert("コピーしました"); });
  } else {
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    alert("コピーしました");
  }
});

document.getElementById("resetBtn").addEventListener("click", function () {
  var rows = document.getElementById("rows");
  rows.innerHTML = "";
  rows.appendChild(makeRow());
  document.getElementById("exportPanel").style.display = "none";
});

// 初期表示は2行
document.getElementById("rows").appendChild(makeRow());
document.getElementById("rows").appendChild(makeRow());

// PWA: Service Worker 登録
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>

</body>
</html>
